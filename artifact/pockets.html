/* ============================================================
   Pockets — design tokens

   Colour carries meaning or it isn't there. The chrome is ink on
   paper; green/red/amber mean money in, money out, and something
   owed. A pocket's colour appears only as a 3px identifying rule
   and its monogram — never as decoration.

   Light is the complete palette; dark redefines the same tokens.
   The effective theme is resolved in JS (app setting > host
   data-theme > OS) and stamped as data-resolved-theme, so every
   colour has exactly one definition per theme.
   ============================================================ */
:root{
  --bg:#EFF1F0;
  --surface:#FFFFFF;
  --surface-2:#F7F8F7;
  --sunken:#E6E9E7;
  --rule:#DCE0DE;
  --rule-strong:#BFC6C3;
  --ink:#14181A;
  --ink-2:#565F63;
  --ink-3:#868F92;
  --pos:#16704F;
  --neg:#A32A28;
  --due:#8A5A00;
  --tint:8%;
  --tab-h:64px;
  --pad:20px;
  --font-text:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-resolved-theme="dark"]{
  --bg:#0C0E0F;
  --surface:#131617;
  --surface-2:#191D1F;
  --sunken:#080A0B;
  --rule:#262B2D;
  --rule-strong:#3C4346;
  --ink:#F0F2F1;
  --ink-2:#9AA3A6;
  --ink-3:#6B7477;
  --pos:#4FBF8B;
  --neg:#F2685F;
  --due:#D9A03C;
  --tint:16%;
  color-scheme:dark;
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important;
  }
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-text);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Every figure is set in the ledger face and aligns in its column. */
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
/* Cents step back so the euros read first, the way a statement sets them. */
.cents{opacity:.55}

/* ============================================================
   Shell
   ============================================================ */
#app{
  max-width:520px;margin:0 auto;position:relative;
  min-height:100vh;min-height:100dvh;
  background:var(--bg);
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));
}
@media (min-width:560px){ #app{border-inline:1px solid var(--rule)} }

#topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(env(safe-area-inset-top) + 18px) var(--pad) 12px;
  display:flex;align-items:flex-end;gap:12px;
  background:var(--bg);
  border-bottom:1px solid var(--rule);
}
.topbar-txt{flex:1;min-width:0}
.topbar-title{
  font-size:19px;font-weight:600;letter-spacing:-.025em;line-height:1.15;
}
.topbar-sub{
  font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.1em;margin-top:4px;
}
.icon-btn{
  width:34px;height:34px;flex:none;border-radius:2px;
  display:grid;place-items:center;color:var(--ink-2);
  border:1px solid var(--rule);background:var(--surface);
  transition:border-color .12s ease,color .12s ease;
}
.icon-btn:active{border-color:var(--rule-strong);color:var(--ink)}

#view{padding:0 var(--pad) 28px}

/* ============================================================
   Type utilities
   ============================================================ */
h2.sec{
  font-family:var(--font-mono);
  font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:30px 0 0;padding-bottom:8px;
  display:flex;align-items:baseline;gap:12px;
  border-bottom:1px solid var(--rule);
}
h2.sec .sec-rule{flex:1}
h2.sec button{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;
  color:var(--ink-2);text-transform:uppercase;border-bottom:1px solid var(--rule-strong);
}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}
.small{font-size:13.5px}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.warn{color:var(--due)}
.center{text-align:center}
.row{display:flex;align-items:center;gap:12px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--rule);padding:16px}

/* ============================================================
   Statement head — the balance sits on the page, not in a card.
   ============================================================ */
.hero{padding:26px 0 0}
.hero-label{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);
}
.hero-amount{
  font-family:var(--font-text);
  font-size:clamp(42px,13vw,54px);font-weight:700;letter-spacing:-.04em;
  line-height:1;margin:10px 0 18px;
  font-variant-numeric:tabular-nums;
}

<!-- Resolve the theme before any content paints: the app's own setting wins,
     then a host that stamps data-theme (the Artifact viewer), then the OS. -->
<script>
(function(){
  function resolve(){
    var pref = "auto";
    try {
      var raw = localStorage.getItem("pockets.budget.v1");
      if (raw) { var s = JSON.parse(raw); if (s && s.settings && s.settings.theme) pref = s.settings.theme; }
    } catch (e) {}
    if (pref === "dark" || pref === "light") return pref;
    var host = document.documentElement.getAttribute("data-theme");
    if (host === "dark" || host === "light") return host;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-resolved-theme", resolve());
})();
</script>

<script>
"use strict";
(function () {

/* ============================================================
   Constants
   ============================================================ */
const STORAGE_KEY = "pockets.budget.v1";
const SCHEMA = 1;
const SYNC_DOC = "budget/state";
const TOMBSTONE_TTL = 365 * 24 * 3600 * 1000;   // a device offline longer than this loses deletions

const CURRENCIES = [
  ["EUR", "€", "Euro"], ["USD", "$", "US Dollar"], ["GBP", "£", "Pound"],
  ["PKR", "Rs", "Rupee"], ["CHF", "CHF", "Franc"], ["SEK", "kr", "Krona"],
  ["PLN", "zł", "Zloty"], ["TRY", "₺", "Lira"], ["AED", "AED", "Dirham"],
  ["CAD", "C$", "Can Dollar"], ["AUD", "A$", "Aus Dollar"], ["INR", "₹", "Indian Rupee"]
];

const PALETTE = ["#2E5EAA","#C1642B","#2C7A5B","#A32A56","#6B4FA8","#B08A00",
                 "#3F7D8C","#8C3A2E","#5C6B2E","#7A4E8C","#1F6F6F","#8A5A2B"];

const EMOJIS = ["", "🎓","🏠","🚌","🚗","🛒","📱","🌐","🛡️","🐷","🚨","💡","🔥","💧","🏋️","☕","🍔","✈️","🎬","💊","👕","📚","🎮","🐶","🎁","🧾","💇","🚲","⛽","🧹","🩺","🅿️","💳"];

/* type: bill = fixed recurring payment | spend = variable monthly budget | save = goal pot */
const DEFAULT_CATEGORIES = [
  { name:"Tuition",        icon:"",  color:"#2E5EAA", type:"bill",  planned:0, dueDay:5  },
  { name:"Rent",           icon:"",  color:"#C1642B", type:"bill",  planned:0, dueDay:1  },
  { name:"Car payment",    icon:"",  color:"#2C7A5B", type:"bill",  planned:0, dueDay:10 },
  { name:"Bus / transport",icon:"",  color:"#A32A56", type:"spend", planned:0, dueDay:null },
  { name:"Groceries",      icon:"",  color:"#6B4FA8", type:"spend", planned:0, dueDay:null },
  { name:"Phone",          icon:"",  color:"#B08A00", type:"bill",  planned:0, dueDay:15 },
  { name:"Internet",       icon:"",  color:"#3F7D8C", type:"bill",  planned:0, dueDay:20 },
  { name:"Insurance",      icon:"",  color:"#8C3A2E", type:"bill",  planned:0, dueDay:25 },
  { name:"Savings",        icon:"",  color:"#5C6B2E", type:"save",  planned:0, goal:0 },
  { name:"Emergency fund", icon:"",  color:"#7A4E8C", type:"save",  planned:0, goal:0 }
];

const EXAMPLE_PLAN = {
  "Tuition":420, "Rent":650, "Car payment":230, "Bus / transport":55,
  "Groceries":280, "Phone":18, "Internet":35, "Insurance":95,
  "Savings":150, "Emergency fund":80
};

const TYPE_LABEL = { bill:"Bill", spend:"Spending", save:"Savings" };

/* ============================================================
   State
   ============================================================ */
let state = null;
let ui = { tab:"home", pocketFilter:"all", statsMonth:null, sheetStack:[] };
let toastTimer = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function defaultState(){
  const now = Date.now();
  return {
    schema: SCHEMA,
    settings: { currency:"EUR", theme:"auto", name:"", hideSetup:false, demo:false,
                sync:true, updatedAt:now },
    categories: DEFAULT_CATEGORIES.map((c, i) => ({
      id: uid(), order: i, archived:false, goal:0, goalDate:null, dueDay:null,
      repeat:null, updatedAt:now, ...c
    })),
    tx: [],
    // Deletions have to travel between devices too, or a merge on the other
    // side would simply put the deleted entry back.
    tombstones: {},      // txId  -> deleted-at ms
    catTombstones: {}    // catId -> deleted-at ms
  };
}

/** A cleared budget that also tells other devices what was cleared. */
function freshState(){
  const now = Date.now();
  const next = defaultState();
  next.tombstones = Object.assign({}, state ? state.tombstones : null);
  next.catTombstones = Object.assign({}, state ? state.catTombstones : null);
  if (state) {
    state.tx.forEach(t => next.tombstones[t.id] = now);
    state.categories.forEach(c => next.catTombstones[c.id] = now);
    next.settings.currency = state.settings.currency;
    next.settings.theme = state.settings.theme;
    next.settings.name = state.settings.name;
    next.settings.sync = state.settings.sync;
  }
  return next;
}

/**
 * A worked example month, used only on a first run so the app opens showing
 * what it does instead of ten empty pockets. Flagged `demo` so a banner can
 * say so on every screen, and one tap replaces it with an empty budget.
 */
function demoState(){
  const s = defaultState();
  s.settings.demo = true;

  const byName = {};
  s.categories.forEach(c => {
    byName[c.name] = c;
    if (EXAMPLE_PLAN[c.name] != null) c.planned = EXAMPLE_PLAN[c.name];
  });
  byName["Savings"].goal = 3000;
  byName["Emergency fund"].goal = 1500;

  const now = new Date();
  const cap = now.getDate();                       // don't post dates in the future
  const at = (offset, day) => {
    const d = new Date(now.getFullYear(), now.getMonth() + offset, 1);
    const last = daysInMonth(d.getFullYear(), d.getMonth());
    d.setDate(clamp(day, 1, offset === 0 ? Math.min(cap, last) : last));
    return isoOf(d);
  };
  const push = t => s.tx.push(Object.assign(
    { id:uid(), date:todayISO(), note:"", catId:null, fromId:null, toId:null, billPeriod:null }, t));

  const BILLS = [["Rent",650,1], ["Tuition",420,5], ["Car payment",230,10],
                 ["Phone",18,15], ["Internet",35,20], ["Insurance",95,25]];
  const SHOPS = [[62.40,3], [48.90,8], [71.25,14], [57.80,21], [44.15,27]];
  const RIDES = [[12.50,2], [12.50,9], [12.50,16], [12.50,23]];
  // Left unpaid in the current month, so the Bills screen shows a realistic
  // mix of paid, due and overdue rather than a wall of green ticks.
  const PENDING = ["Tuition", "Car payment", "Insurance"];

  for (let off = -3; off <= 0; off++) {
    const mk = monthKeyOf(new Date(now.getFullYear(), now.getMonth() + off, 1));
    const current = off === 0;

    push({ kind:"income", amount: current ? 2400 : 2050, date:at(off, 1), note:"Salary" });

    s.categories.forEach(c => {
      if (num(c.planned) > 0) {
        push({ kind:"allocate", amount:c.planned, catId:c.id, date:at(off, 1), note:"auto-assign" });
      }
    });

    BILLS.forEach(([name, amt, day]) => {
      if (current && (day > cap || PENDING.indexOf(name) > -1)) return;
      push({ kind:"expense", amount:amt, catId:byName[name].id, date:at(off, day), note:name, billPeriod:mk });
    });
    SHOPS.forEach(([amt, day]) => {
      if (current && day > cap) return;
      push({ kind:"expense", amount:amt, catId:byName["Groceries"].id, date:at(off, day), note:"Groceries" });
    });
    RIDES.forEach(([amt, day]) => {
      if (current && day > cap) return;
      push({ kind:"expense", amount:amt, catId:byName["Bus / transport"].id, date:at(off, day), note:"Bus fare" });
    });
  }
  return s;
}

function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) {
    console.warn("Could not read saved data", e);
  }
  try { return demoState(); } catch (e) { return defaultState(); }
}

function migrate(data){
  if (!data || typeof data !== "object") return defaultState();
  const base = defaultState();
  const s = {
    schema: SCHEMA,
    settings: Object.assign({}, base.settings, data.settings || {}),
    categories: Array.isArray(data.categories) ? data.categories : base.categories,
    tx: Array.isArray(data.tx) ? data.tx : []
  };
  if (["auto","dark","light"].indexOf(s.settings.theme) < 0) s.settings.theme = "auto";
  s.settings.demo = !!s.settings.demo;
  s.settings.sync = s.settings.sync !== false;
  s.settings.updatedAt = num(s.settings.updatedAt);
  s.tombstones = tsMap(data.tombstones);
  s.catTombstones = tsMap(data.catTombstones);
  s.categories = s.categories.map((c, i) => ({
    id: c.id || uid(),
    updatedAt: num(c.updatedAt),
    order: typeof c.order === "number" ? c.order : i,
    name: String(c.name || "Untitled"),
    icon: c.icon || "",
    color: c.color || PALETTE[i % PALETTE.length],
    type: ["bill","spend","save"].includes(c.type) ? c.type : "spend",
    planned: num(c.planned),
    goal: num(c.goal),
    goalDate: /^\d{4}-\d{2}$/.test(c.goalDate || "") ? c.goalDate : null,
    repeat: normaliseRepeat(c.repeat),
    dueDay: c.dueDay == null ? null : clamp(Math.round(num(c.dueDay)), 1, 31),
    archived: !!c.archived
  }));
  s.tx = s.tx.filter(t => t && t.id && t.kind).map(t => ({
    id: t.id,
    kind: t.kind,                       // income | expense | allocate | move
    amount: num(t.amount),
    date: t.date || todayISO(),
    note: t.note ? String(t.note) : "",
    auto: !!t.auto,
    catId: t.catId || null,             // expense/allocate target pocket (null = unassigned cash)
    fromId: t.fromId || null,           // move source
    toId: t.toId || null,               // move destination
    billPeriod: t.billPeriod || null    // "YYYY-MM" when this expense settles a bill
  }));
  return s;
}

let saveTimer = null;
/** Persist to this device only — used when applying something that just
    arrived from another device, so it doesn't bounce straight back. */
function saveLocal(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { toast("Couldn't save — storage is full or blocked"); }
  }, 60);
}
function save(){ saveLocal(); schedulePush(); }

/** A repeating charge: an amount, the weekdays it lands on, and where to
    start counting from. Anything malformed becomes "no rule". */
function normaliseRepeat(r){
  if (!r || typeof r !== "object") return null;
  const amount = round2(num(r.amount));
  const days = Array.isArray(r.days)
    ? r.days.map(Number).filter(d => d >= 0 && d <= 6).sort()
    : [];
  if (amount <= 0 || !days.length) return null;
  return {
    amount: amount,
    days: days.filter((d, i, a) => a.indexOf(d) === i),
    start: /^\d{4}-\d{2}-\d{2}$/.test(r.start || "") ? r.start : todayISO()
  };
}

/** Sanitise a tombstone map to {id: timestamp}, dropping very old entries. */
function tsMap(raw){
  const out = {};
  if (raw && typeof raw === "object" && !Array.isArray(raw)) {
    const cutoff = Date.now() - TOMBSTONE_TTL;
    Object.keys(raw).forEach(k => {
      const t = Number(raw[k]);
      if (Number.isFinite(t) && t > cutoff) out[k] = t;
    });
  }
  return out;
}
function newestTombstones(a, b){
  const out = Object.assign({}, a);
  Object.keys(b || {}).forEach(k => { if (!(out[k] > b[k])) out[k] = b[k]; });
  return out;
}

/* ============================================================
   Small helpers
   ============================================================ */
function num(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }
function clamp(n, lo, hi){ return Math.min(hi, Math.max(lo, n)); }
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }

function todayISO(){ const d = new Date(); return isoOf(d); }
function isoOf(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parseISO(s){ const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); }
function monthKeyOf(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function thisMonth(){ return monthKeyOf(new Date()); }
function monthOfISO(iso){ return String(iso).slice(0,7); }
function daysInMonth(y, m){ return new Date(y, m+1, 0).getDate(); }
function shiftMonth(mk, delta){
  const [y,m] = mk.split("-").map(Number);
  const d = new Date(y, m-1+delta, 1);
  return monthKeyOf(d);
}
function monthLabel(mk, long){
  const [y,m] = mk.split("-").map(Number);
  const d = new Date(y, m-1, 1);
  return d.toLocaleDateString(undefined, { month: long ? "long" : "short", year:"numeric" });
}

function currencyMeta(){
  return CURRENCIES.find(c => c[0] === state.settings.currency) || CURRENCIES[0];
}
function fmt(n, opts){
  const o = opts || {};
  const code = state.settings.currency;
  const v = round2(num(n));
  try {
    return new Intl.NumberFormat(undefined, {
      style:"currency", currency: code,
      minimumFractionDigits: o.compact && Number.isInteger(v) ? 0 : 2,
      maximumFractionDigits: 2
    }).format(v);
  } catch (e) {
    return currencyMeta()[1] + v.toFixed(2);
  }
}
function fmtSigned(n){ return (n > 0 ? "+" : "") + fmt(n); }

/**
 * Accepts what people actually type: "1.234,56", "1234.56", "1 234,56", "€12".
 * Rule: whichever separator comes last is the decimal point; repeated
 * separators are thousands grouping. A lone comma is decimal (EU habit).
 */
function parseAmount(str){
  if (typeof str === "number") return round2(num(str));
  let s = String(str == null ? "" : str).trim();
  if (!s) return 0;
  s = s.replace(/[^\d.,-]/g, "");
  if (!s || s === "-") return 0;

  const commas = (s.match(/,/g) || []).length;
  const dots = (s.match(/\./g) || []).length;
  const lastComma = s.lastIndexOf(","), lastDot = s.lastIndexOf(".");

  if (commas && dots) {
    // Both present: the rightmost one is the decimal separator.
    if (lastComma > lastDot) s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(/,/g, "");
  } else if (commas > 1) {
    s = s.replace(/,/g, "");            // 1,234,567 -> grouping
  } else if (commas === 1) {
    s = s.replace(",", ".");            // 12,50 -> 12.50
  } else if (dots > 1) {
    s = s.replace(/\./g, "");           // 1.234.567 -> grouping
  }

  const n = parseFloat(s);
  return Number.isFinite(n) ? round2(n) : 0;
}

function relDay(iso){
  const d = parseISO(iso), t = new Date();
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const b = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const diff = Math.round((a - b) / 86400000);
  if (diff === 0) return "Today";
  if (diff === -1) return "Yesterday";
  if (diff === 1) return "Tomorrow";
  if (diff > 1 && diff < 7) return "In " + diff + " days";
  if (diff < 0 && diff > -7) return Math.abs(diff) + " days ago";
  return d.toLocaleDateString(undefined, { day:"numeric", month:"short" });
}

/* ============================================================
   Derived values (recomputed on every render — single source of
   truth is the transaction log)
   ============================================================ */
function derive(){
  const cats = state.categories.filter(c => !c.archived).sort((a,b) => a.order - b.order);
  const balance = {};        // pocket id -> money currently set aside
  state.categories.forEach(c => balance[c.id] = 0);

  let cash = 0;              // total money on hand
  let allocated = 0;         // total sitting inside pockets

  for (const t of state.tx) {
    const amt = num(t.amount);
    if (t.kind === "income") {
      cash += amt;
    } else if (t.kind === "expense") {
      cash -= amt;
      if (t.catId && balance[t.catId] !== undefined) { balance[t.catId] -= amt; allocated -= amt; }
    } else if (t.kind === "allocate") {
      if (t.catId && balance[t.catId] !== undefined) { balance[t.catId] += amt; allocated += amt; }
    } else if (t.kind === "move") {
      if (t.fromId && balance[t.fromId] !== undefined) { balance[t.fromId] -= amt; allocated -= amt; }
      if (t.toId && balance[t.toId] !== undefined) { balance[t.toId] += amt; allocated += amt; }
    }
  }

  return {
    cats,
    balance,
    cash: round2(cash),
    allocated: round2(allocated),
    unassigned: round2(cash - allocated)
  };
}

function spentIn(mk, catId){
  let total = 0;
  for (const t of state.tx) {
    if (t.kind !== "expense") continue;
    if (monthOfISO(t.date) !== mk) continue;
    if (catId !== undefined && t.catId !== catId) continue;
    total += num(t.amount);
  }
  return round2(total);
}
function incomeIn(mk){
  let total = 0;
  for (const t of state.tx) if (t.kind === "income" && monthOfISO(t.date) === mk) total += num(t.amount);
  return round2(total);
}

/* ---- bills ---- */
function dueDateFor(cat, mk){
  if (!cat.dueDay) return null;
  const [y, m] = mk.split("-").map(Number);
  const day = clamp(cat.dueDay, 1, daysInMonth(y, m-1));
  return new Date(y, m-1, day);
}
function isPaid(cat, mk){
  return state.tx.some(t => t.kind === "expense" && t.catId === cat.id && t.billPeriod === mk);
}
function paidAmount(cat, mk){
  return round2(state.tx
    .filter(t => t.kind === "expense" && t.catId === cat.id && t.billPeriod === mk)
    .reduce((s, t) => s + num(t.amount), 0));
}
/** All bill occurrences for a month, sorted by due date. */
function billsFor(mk, cats){
  return cats
    .filter(c => c.dueDay && c.type !== "save")
    .map(c => {
      const due = dueDateFor(c, mk);
      const paid = isPaid(c, mk);
      const today = new Date(); today.setHours(0,0,0,0);
      const days = Math.round((due - today) / 86400000);
      return { cat:c, due, mk, paid, days, overdue: !paid && days < 0 };
    })
    .sort((a,b) => a.due - b.due);
}
/** Upcoming bills across this month and the next, unpaid only. */
function upcomingBills(cats, limit){
  const mk = thisMonth();
  const list = billsFor(mk, cats).concat(billsFor(shiftMonth(mk, 1), cats))
    .filter(b => !b.paid)
    .sort((a,b) => a.due - b.due);
  return limit ? list.slice(0, limit) : list;
}

/* ============================================================
   Sync (Artifact builds only)
   ------------------------------------------------------------
   The whole budget lives in one document, but devices MERGE rather
   than overwrite. Replacing the document wholesale would mean the
   last device to write silently erases anything the other recorded
   while it was offline — for a budget, that is losing a rent payment.

   Merging works because the three parts each have a rule that gives
   the same answer whichever order the devices apply it in:
     transactions  union by id, minus anything tombstoned
     pockets       per id, the copy with the newer updatedAt
     settings      whole-object, the copy with the newer updatedAt

   `theme` is deliberately NOT synced: a phone and a laptop can
   reasonably want different ones.
   ============================================================ */
const hostBridge = (window.claude && typeof window.claude.use === "function") ? window.claude : null;

let syncRef = null;
let syncUnsub = null;
let lastPushedSig = null;
let pushTimer = null;
let syncRetry = 0;
/* off | unsupported | connecting | live | saving | retrying | full | blocked */
let syncState = hostBridge ? "connecting" : "unsupported";
let syncedAt = 0;

/** Stable serialisation: both devices must produce byte-identical text for
    logically identical budgets, or they would push at each other forever. */
function canon(v){
  if (Array.isArray(v)) return "[" + v.map(canon).join(",") + "]";
  if (v && typeof v === "object") {
    return "{" + Object.keys(v).sort()
      .map(k => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}";
  }
  return JSON.stringify(v === undefined ? null : v);
}

/* Preferences that belong to the device, not the budget: a phone and a laptop
   can want different themes, and turning sync off here must not turn it off
   over there. */
const LOCAL_SETTINGS = ["theme", "sync", "demo"];

function syncPayload(s){
  const settings = {};
  Object.keys(s.settings).forEach(k => {
    if (LOCAL_SETTINGS.indexOf(k) < 0) settings[k] = s.settings[k];
  });
  const byId = (a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
  return {
    schema: SCHEMA,
    settings: settings,
    categories: s.categories.slice().sort(byId),
    tx: s.tx.slice().sort(byId),
    tombstones: s.tombstones,
    catTombstones: s.catTombstones
  };
}

function mergeStates(local, remote){
  const tombs = newestTombstones(local.tombstones, remote.tombstones);
  const catTombs = newestTombstones(local.catTombstones, remote.catTombstones);

  const txById = {};
  local.tx.concat(remote.tx).forEach(t => { if (!tombs[t.id]) txById[t.id] = t; });

  const catById = {};
  local.categories.concat(remote.categories).forEach(c => {
    if (catTombs[c.id]) return;
    const prev = catById[c.id];
    if (!prev || num(c.updatedAt) >= num(prev.updatedAt)) catById[c.id] = c;
  });

  const remoteWins = num(remote.settings.updatedAt) > num(local.settings.updatedAt);
  const settings = Object.assign({}, remoteWins ? remote.settings : local.settings);
  LOCAL_SETTINGS.forEach(k => settings[k] = local.settings[k]);

  return {
    schema: SCHEMA,
    settings: settings,
    categories: Object.keys(catById).map(k => catById[k]).sort((a, b) => a.order - b.order),
    tx: Object.keys(txById).map(k => txById[k]),
    tombstones: tombs,
    catTombstones: catTombs
  };
}

function syncEnabled(){
  return !!syncRef && state.settings.sync !== false && !state.settings.demo;
}

function setSyncState(s){
  if (syncState === s) return;
  syncState = s;
  paintSyncStatus();
}

function schedulePush(immediate){
  if (!syncEnabled()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, immediate ? 0 : 900);
}

function pushNow(){
  if (!syncEnabled()) return;
  const body = syncPayload(state);
  const sig = canon(body);
  if (sig === lastPushedSig) return;          // nothing new to say
  setSyncState("saving");
  syncRef.set(body).then(() => {
    lastPushedSig = sig;
    syncRetry = 0;
    syncedAt = Date.now();
    setSyncState("live");
  }, err => {
    const code = err && err.code;
    if (code === "invalid_argument") {
      // Almost always the 256 KiB document ceiling.
      setSyncState("full");
    } else if (code === "revoked" || code === "not_granted" ||
               code === "capability_disabled" || code === "capability_removed") {
      stopSync("blocked");
    } else {
      setSyncState("retrying");
      if (syncRetry < 6) {
        const wait = Math.min(30000, 1500 * Math.pow(2, syncRetry++)) + Math.random() * 500;
        setTimeout(() => schedulePush(true), wait);
      }
    }
  });
}

function onRemote(snap){
  if (!state.settings.sync) return;

  if (!snap.exists) {                 // first device to arrive: seed the store
    setSyncState("live");
    if (!state.settings.demo) schedulePush(true);
    return;
  }

  let remote;
  try { remote = migrate(snap.data()); }
  catch (e) { setSyncState("live"); return; }
  if (!Array.isArray(remote.categories) || !remote.categories.length) {
    setSyncState("live");
    return;
  }

  // Example data is never merged — a device still showing it adopts the
  // real budget wholesale instead of blending fake figures into it.
  if (state.settings.demo) {
    const theme = state.settings.theme;
    state = remote;
    state.settings.theme = theme;
    state.settings.demo = false;
    lastPushedSig = canon(syncPayload(state));
    saveLocal();
    setSyncState("live");
    syncedAt = Date.now();
    render();
    toast("Budget loaded from your other device");
    return;
  }

  const before = canon(syncPayload(state));
  const merged = mergeStates(state, remote);
  const after = canon(syncPayload(merged));

  if (after !== before) {
    state = merged;
    saveLocal();
    render();
  }
  syncedAt = Date.now();
  setSyncState("live");
  // If the merge produced anything the store doesn't have yet, send it back.
  if (after !== canon(syncPayload(remote))) schedulePush(true);
  else lastPushedSig = after;
}

function stopSync(reason){
  if (syncUnsub) { try { syncUnsub(); } catch (e) {} }
  syncUnsub = null;
  syncRef = null;
  clearTimeout(pushTimer);
  setSyncState(reason || "off");
}

function startSync(){
  if (!hostBridge) { setSyncState("unsupported"); return; }
  hostBridge.use("db").then(db => {
    if (!db) { setSyncState("unsupported"); return; }
    try { syncRef = db.doc(SYNC_DOC); }
    catch (e) { setSyncState("unsupported"); return; }
    if (state.settings.sync === false) { setSyncState("off"); return; }
    setSyncState("connecting");
    syncUnsub = syncRef.onSnapshot(onRemote, err => {
      syncUnsub = null;
      const code = err && err.code;
      stopSync(code === "revoked" || code === "not_granted" ? "blocked" : "off");
    });
  }, () => setSyncState("unsupported"));
}

const SYNC_COPY = {
  unsupported: ["Not available here", "Sync needs the shared link version of the app."],
  off:         ["Off", "This device keeps its budget to itself."],
  connecting:  ["Connecting…", "Looking for your other devices."],
  live:        ["On", "Your devices stay in step automatically."],
  saving:      ["Saving…", "Sending your latest changes."],
  retrying:    ["Reconnecting…", "Changes are saved on this device and will go up shortly."],
  full:        ["Too much history", "The budget is too big to sync. Back it up, then clear old months."],
  blocked:     ["Unavailable", "This view isn't allowed to sync. Your budget is safe on this device."]
};
function syncBadge(){
  if (syncState === "live" || syncState === "saving") return "green";
  if (syncState === "retrying" || syncState === "connecting") return "amber";
  if (syncState === "full" || syncState === "blocked") return "red";
  return "";
}
function paintSyncStatus(){
  const row = document.getElementById("sync-row");
  if (row) {
    row.querySelector("[data-sync-label]").textContent = SYNC_COPY[syncState][0];
    row.querySelector("[data-sync-note]").textContent = SYNC_COPY[syncState][1];
    row.querySelector("[data-sync-badge]").className = "syncdot " + syncBadge();
  }
  const sub = document.getElementById("tb-sub");
  if (sub && sub.dataset.base) {
    const mark = { saving:" · saving", retrying:" · offline", full:" · sync full", blocked:"" }[syncState];
    sub.textContent = sub.dataset.base + (mark || "");
  }
}

/* ============================================================
   Rendering
   ============================================================ */
const view = document.getElementById("view");

/* The app setting wins; otherwise follow a host that stamps data-theme
   (the Artifact viewer does), otherwise the OS preference. */
const themeQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
function resolvedTheme(){
  const pref = state && state.settings ? state.settings.theme : "auto";
  if (pref === "dark" || pref === "light") return pref;
  const host = document.documentElement.getAttribute("data-theme");
  if (host === "dark" || host === "light") return host;
  return themeQuery && themeQuery.matches ? "dark" : "light";
}
function applyTheme(){
  const t = resolvedTheme();
  document.documentElement.setAttribute("data-resolved-theme", t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", t === "light" ? "#EFF1F0" : "#0C0E0F");
  return t;
}

function demoBanner(){
  return `
  <div id="demobar">
    <span class="db-txt"><b>Example data</b>Not your money — figures to show how it works.</span>
    <button data-act="startfresh">Start fresh</button>
  </div>`;
}

function render(){
  const d = derive();
  applyTheme();

  const title = document.getElementById("tb-title");
  const sub = document.getElementById("tb-sub");
  const nm = state.settings.name ? state.settings.name : "";
  title.textContent = ui.tab === "home" ? (nm ? greeting() + ", " + nm : greeting()) : tabTitle(ui.tab);
  sub.dataset.base = ui.tab === "home"
    ? new Date().toLocaleDateString(undefined, { weekday:"long", day:"numeric", month:"long" })
    : subFor(ui.tab, d);
  sub.textContent = sub.dataset.base;

  document.querySelectorAll("#tabbar [data-tab]").forEach(b => {
    b.setAttribute("aria-selected", b.dataset.tab === ui.tab ? "true" : "false");
  });

  let html = state.settings.demo ? demoBanner() : "";
  if (ui.tab === "home") html += viewHome(d);
  else if (ui.tab === "pockets") html += viewPockets(d);
  else if (ui.tab === "bills") html += viewBills(d);
  else html += viewStats(d);
  view.innerHTML = html;
  paintSyncStatus();

  view.style.animation = "none"; void view.offsetHeight; view.style.animation = "";
}

function greeting(){
  const h = new Date().getHours();
  if (h < 12) return "Good morning";
  if (h < 18) return "Good afternoon";
  return "Good evening";
}
function tabTitle(t){
  return { pockets:"Pockets", bills:"Bills & due dates", stats:"Statistics" }[t] || "Pockets";
}
function subFor(t, d){
  if (t === "pockets") return d.cats.length + " pockets · " + fmt(d.allocated) + " set aside";
  if (t === "bills") return monthLabel(thisMonth(), true);
  return "Where your money goes";
}

/* ---------- Home ---------- */
function viewHome(d){
  const mk = thisMonth();
  const planned = round2(d.cats.reduce((s,c) => s + num(c.planned), 0));

  const needsSetup = planned === 0 && !state.settings.hideSetup;

  let html = `
  <section class="hero">
    <div class="hero-label">Total balance</div>
    <div class="hero-amount">${fmtRich(d.cash)}</div>
    <div class="hero-chips">
      <span class="chip"><i>In pockets</i><b>${esc(fmt(d.allocated))}</b></span>
      <span class="chip"><i>To assign</i><b class="${d.unassigned < 0 ? "neg" : ""}">${esc(fmt(d.unassigned))}</b></span>
    </div>
  </section>

  <div class="quick">

  } else {
    html += `<div class="list">` + up.map(b => billRow(b, d)).join("") + `</div>`;
  }

  const pct = planned > 0 ? clamp(spent / planned * 100, 0, 100) : 0;
  html += `
  <h2 class="sec">${esc(monthLabel(mk, true))}<span class="sec-rule"></span></h2>
  <div class="card">
    <div class="spread">
      <div>
        <div class="tiny muted">Spent</div>
        <div class="num" style="font-size:23px;font-weight:750;letter-spacing:-.03em">${esc(fmt(spent))}</div>
      </div>
      <div style="text-align:right">
        <div class="tiny muted">Planned</div>
        <div class="num" style="font-size:15px;font-weight:650">${esc(fmt(planned))}</div>

    <div class="spread tiny muted" style="margin-top:8px">
      <span>Income ${esc(fmt(incomeIn(mk), {compact:true}))}</span>

    </div>
  </div>`;

  /* Recent */
  html += `<h2 class="sec">Recent ${state.tx.length ? `<button data-act="history">See all</button>` : ""}</h2>`;
  if (!recent.length) {

function byDateDesc(a, b){
  if (a.date === b.date) return a.id < b.id ? 1 : -1;
  return a.date < b.date ? 1 : -1;
}

function billRow(b, d){
  const c = b.cat;
  const bal = d.balance[c.id] || 0;
  const covered = bal >= c.planned - 0.005 && c.planned > 0;
  let badge;
  if (b.paid) badge = `<span class="badge green">Paid</span>`;
  else if (b.overdue) badge = `<span class="badge red">${Math.abs(b.days)}d overdue</span>`;
  else if (b.days === 0) badge = `<span class="badge amber">Due today</span>`;
  else if (b.days <= 5) badge = `<span class="badge amber">In ${b.days}d</span>`;
  else badge = `<span class="badge">${esc(b.due.toLocaleDateString(undefined,{day:"numeric",month:"short"}))}</span>`;

  return `
  <button class="item" data-open-cat="${esc(c.id)}" style="--accent-c:${esc(c.color)}">
    ${catMark(c)}
    <span class="grow">
      <span class="item-title ellip">${esc(c.name)}</span>
      <div class="item-sub">${b.paid ? "Settled " + esc(monthLabel(b.mk)) : (covered ? "Money is ready" : "Pocket has " + esc(fmt(bal, {compact:true})))}</div>
    </span>
    <span style="text-align:right">
      <div class="item-amt num">${esc(fmt(c.planned, {compact:true}))}</div>
      <div style="margin-top:4px">${badge}</div>
    </span>
  </button>`;
}

function txRow(t){
  const cat = state.categories.find(c => c.id === (t.catId || t.toId));
  const from = state.categories.find(c => c.id === t.fromId);
  let icon = "IN", title = "Income", sub = "", amt = "", cls = "";

  if (t.kind === "income") {
    icon = "IN"; title = t.note || "Money in"; sub = "To unassigned"; amt = "+" + fmt(t.amount); cls = "pos";
  } else if (t.kind === "expense") {
    icon = cat ? (cat.icon || markFor(cat)) : "OUT";
    title = t.note || (cat ? cat.name : "Spending");
    sub = (cat ? cat.name : "Unassigned")
        + (t.billPeriod ? " · bill paid" : "")
        + (t.auto ? " · repeating" : "");
    amt = "−" + fmt(t.amount);
  } else if (t.kind === "allocate") {
    icon = cat ? (cat.icon || markFor(cat)) : "ASN";
    title = (num(t.amount) >= 0 ? "Assigned to " : "Returned from ") + (cat ? cat.name : "pocket");
    sub = t.note || "Between unassigned and pocket";
    amt = fmt(Math.abs(t.amount)); cls = "muted";
  } else if (t.kind === "move") {
    icon = "MOV";
    title = (from ? from.name : "?") + " → " + (cat ? cat.name : "?");
    sub = t.note || "Moved between pockets";
    amt = fmt(t.amount); cls = "muted";
  }

  return `
  <button class="item" data-open-tx="${esc(t.id)}" style="--accent-c:${cat ? esc(cat.color) : "transparent"}">
    <span class="ico${cat && cat.icon ? " emoji" : ""}" style="--accent-c:${cat ? esc(cat.color) : "var(--ink-3)"}">${esc(icon)}</span>
    <span class="grow">
      <span class="item-title ellip">${esc(title)}</span>
      <div class="item-sub ellip">${esc(sub)}</div>
    </span>
    <span class="item-amt num ${cls}">${esc(amt)}<small>${esc(relDay(t.date))}</small></span>
  </button>`;
}

/* ---------- Pockets ---------- */
function viewPockets(d){

  let html = `

      <div>
        <div class="tiny muted">To assign</div>
        <div class="num ${d.unassigned < 0 ? "neg" : ""}" style="font-size:26px;font-weight:750;letter-spacing:-.03em">${esc(fmt(d.unassigned))}</div>
      </div>
      <button class="btn primary" style="width:auto;padding:11px 16px;font-size:14px" data-act="autofill">Auto-assign</button>
    </div>
    ${d.unassigned < -0.005 ? `<div class="tiny neg" style="margin-top:8px">You've assigned more than you have. Return some money from a pocket.</div>` : ""}
  </div>

  <div class="seg">

function pocketCard(c, d){
  const bal = round2(d.balance[c.id] || 0);
  const mk = thisMonth();
  const spent = spentIn(mk, c.id);
  const target = c.type === "save" ? num(c.goal) : num(c.planned);
  const pct = target > 0 ? clamp(bal / target * 100, 0, 100) : 0;
  const overspent = c.type !== "save" && c.planned > 0 && spent > c.planned;

  let sub;
  const pace = goalPace(c, bal);
  if (c.type === "save") {
    if (pace) sub = pace.done ? `${fmt(target,{compact:true})} reached`
      : pace.overdue ? `${fmt(pace.remaining,{compact:true})} short · ${pace.label} has passed`
      : `${fmt(pace.perMonth,{compact:true})}/mo to reach ${fmt(target,{compact:true})} by ${pace.label}`;
    else if (target > 0) sub = `${fmt(bal,{compact:true})} of ${fmt(target,{compact:true})} goal`;
    else if (num(c.planned) > 0) sub = `${fmt(c.planned,{compact:true})}/mo aside · no goal yet`;
    else sub = "No goal set";
  }
  else if (c.type === "bill") sub = c.dueDay ? `Due the ${ordinal(c.dueDay)} · ${fmt(c.planned,{compact:true})}/mo` : `${fmt(c.planned,{compact:true})}/mo`;
  else sub = `${fmt(spent,{compact:true})} spent of ${fmt(c.planned,{compact:true})} this month`
           + (c.repeat ? ` · ${repeatSummary(c.repeat)}` : "");

  let badge = "";
  if (c.type === "bill" && c.dueDay) {
    badge = isPaid(c, mk) ? `<span class="badge green">Paid</span>` :
      (bal >= c.planned - 0.005 && c.planned > 0 ? `<span class="badge accent">Ready</span>` : `<span class="badge amber">Short ${fmt(Math.max(0, c.planned - bal), {compact:true})}</span>`);
  } else if (overspent) {
    badge = `<span class="badge red">Over</span>`;
  } else if (c.type === "save") {
    if (target > 0 && bal >= target) badge = `<span class="badge green">Goal met</span>`;
    else if (pace && pace.overdue) badge = `<span class="badge red">Past date</span>`;
    else if (pace && num(c.planned) > 0) badge = pace.onTrack
      ? `<span class="badge green">On track</span>`
      : `<span class="badge amber">Behind</span>`;
  }

  return `
  <button class="item" style="flex-direction:column;align-items:stretch;gap:0;--accent-c:${esc(c.color)}" data-open-cat="${esc(c.id)}">
    <span class="row">
      ${catMark(c)}
      <span class="grow">
        <span class="item-title ellip">${esc(c.name)}</span>
        <div class="item-sub ellip">${esc(sub)}</div>
      </span>
      <span style="text-align:right">
        <div class="item-amt num ${bal < 0 ? "neg" : ""}">${esc(fmt(bal, {compact:true}))}</div>
        ${badge ? `<div style="margin-top:4px">${badge}</div>` : ""}
      </span>
    </span>
    ${target > 0 ? `<span class="bar"><i style="width:${pct}%;background:${overspent ? "var(--neg)" : "var(--ink)"}"></i></span>` : ""}
  </button>`;
}

/**
 * What a dated savings goal asks of you: months left, the amount per month
 * that reaches it, and whether the pocket's monthly figure keeps up. A goal
 * with a date means nothing as "€4,600 by September" — it means something as
 * "€383 a month, and you are €50 short".
 */
function goalPace(c, bal){
  if (c.type !== "save" || !c.goalDate || num(c.goal) <= 0) return null;
  const parts = c.goalDate.split("-").map(Number);
  const now = new Date();
  const monthsLeft = (parts[0] - now.getFullYear()) * 12 + (parts[1] - 1 - now.getMonth());
  const remaining = round2(Math.max(0, num(c.goal) - bal));
  const perMonth = monthsLeft > 0 ? round2(remaining / monthsLeft) : remaining;
  return {
    monthsLeft: monthsLeft,
    remaining: remaining,
    perMonth: perMonth,
    done: remaining <= 0.005,
    overdue: monthsLeft <= 0 && remaining > 0.005,
    onTrack: num(c.planned) >= perMonth - 0.005,
    label: monthLabel(c.goalDate, true)
  };
}

/** Two-letter mark from the pocket name — the convention a bank uses when
    there is no logo, and far more legible at 36px than a tinted emoji. */
function monogram(name){
  const parts = String(name || "").replace(/[^\p{L}\p{N}]+/gu, " ").trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "--";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}
function markFor(c){
  const base = monogram(c.name);
  const clash = state.categories.some(o =>
    !o.archived && o.id !== c.id && !o.icon && monogram(o.name) === base);
  if (!clash) return base;
  return String(c.name).replace(/[^\p{L}\p{N}]+/gu, "").slice(0, 3).toUpperCase();
}
function catMark(c, extra){
  const glyph = c.icon ? esc(c.icon) : esc(markFor(c));
  return `<span class="ico${c.icon ? " emoji" : ""}" style="--accent-c:${esc(c.color)}${extra || ""}">${glyph}</span>`;
}
/** Set the cents a shade back, the way a statement does. */
function fmtRich(v){
  const t = fmt(v);
  const m = t.match(/^(.*)([.,])(\d{2})$/);
  return m ? esc(m[1]) + `<span class="cents">${esc(m[2] + m[3])}</span>` : esc(t);
}

function ordinal(n){
  const s = ["th","st","nd","rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

/* ---------- Bills ---------- */
function viewBills(d){
  const mk = ui.statsMonth || thisMonth();
  const bills = billsFor(mk, d.cats);
  const total = round2(bills.reduce((s,b) => s + num(b.cat.planned), 0));
  const paid = round2(bills.filter(b => b.paid).reduce((s,b) => s + paidAmount(b.cat, mk), 0));
  const remaining = round2(bills.filter(b => !b.paid).reduce((s,b) => s + num(b.cat.planned), 0));
  const ready = round2(bills.filter(b => !b.paid).reduce((s,b) => s + Math.min(num(b.cat.planned), Math.max(0, d.balance[b.cat.id] || 0)), 0));

  let html = `
  <div class="monthnav">
    <button data-month="-1" aria-label="Previous month">${svgChev("left")}</button>
    <div class="m">${esc(monthLabel(mk, true))}</div>
    <button data-month="1" aria-label="Next month">${svgChev("right")}</button>
  </div>

  <div class="tiles" style="margin-top:12px">
    <div class="tile"><div class="t-lab">Due</div><div class="t-val num">${esc(fmt(total, {compact:true}))}</div></div>
    <div class="tile"><div class="t-lab">Paid</div><div class="t-val num pos">${esc(fmt(paid, {compact:true}))}</div></div>
    <div class="tile"><div class="t-lab">Left</div><div class="t-val num">${esc(fmt(remaining, {compact:true}))}</div></div>
  </div>

  ${remaining > 0 ? `
  <div style="padding:14px 0 12px;border-bottom:1px solid var(--rule)">
    <div class="spread tiny">
      <span class="item-sub" style="margin:0">Money already set aside for these</span>
      <b class="num ${ready >= remaining - 0.005 ? "pos" : "warn"}">${esc(fmt(ready, {compact:true}))} / ${esc(fmt(remaining, {compact:true}))}</b>
    </div>
    <div class="bar"><i style="width:${remaining > 0 ? clamp(ready/remaining*100,0,100) : 0}%;background:${ready >= remaining - 0.005 ? "var(--pos)" : "var(--due)"}"></i></div>
  </div>` : ""}`;

  if (!bills.length) {
    html += `
    <div class="empty">No bills with due dates yet.<br>
      Open a pocket and give it a due day.</div>`;
    return html;
  }

  const groups = [
    ["Overdue", bills.filter(b => b.overdue)],
    ["Unpaid", bills.filter(b => !b.paid && !b.overdue)],
    ["Paid", bills.filter(b => b.paid)]
  ];
  for (const [label, items] of groups) {
    if (!items.length) continue;
    html += `<h2 class="sec">${label} · ${items.length}<span class="sec-rule"></span></h2><div class="list">`;
    html += items.map(b => billFullRow(b, d)).join("");
    html += `</div>`;
  }
  return html;
}

function billFullRow(b, d){
  const c = b.cat;
  const bal = round2(d.balance[c.id] || 0);
  const short = round2(Math.max(0, num(c.planned) - bal));
  let note;
  if (b.paid) note = "Paid " + fmt(paidAmount(c, b.mk), {compact:true});
  else if (short > 0.005) note = "Short " + fmt(short, {compact:true}) + " in pocket";
  else note = "Ready to pay";

  return `
  <div class="item" style="flex-direction:column;align-items:stretch;gap:12px;--accent-c:${esc(c.color)}">
    <div class="row">
      ${catMark(c)}
      <span class="grow">
        <span class="item-title ellip">${esc(c.name)}</span>
        <div class="item-sub">${esc(b.due.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}))} · ${esc(note)}</div>
      </span>
      <span class="item-amt num">${esc(fmt(c.planned, {compact:true}))}</span>
    </div>
    <div class="btn-row">
      ${b.paid
        ? `<button class="btn" style="padding:10px" data-unpay="${esc(c.id)}|${esc(b.mk)}">Undo payment</button>`
        : `<button class="btn" style="padding:10px;border-color:var(--ink)" data-pay="${esc(c.id)}|${esc(b.mk)}">Mark as paid</button>`}
      <button class="btn" style="padding:10px;color:var(--ink-2);border-color:var(--rule)" data-open-cat="${esc(c.id)}">Open pocket</button>
    </div>
  </div>`;
}

/* ---------- Stats ---------- */
function viewStats(d){
  const mk = ui.statsMonth || thisMonth();
  const income = incomeIn(mk);
  const spent = spentIn(mk);
  const planned = round2(d.cats.reduce((s,c) => s + num(c.planned), 0));

  const rows = d.cats.map(c => ({ c, spent: spentIn(mk, c.id) }))
    .filter(r => r.spent > 0 || num(r.c.planned) > 0)
    .sort((a,b) => b.spent - a.spent);
  const unassignedSpend = round2(state.tx
    .filter(t => t.kind === "expense" && !t.catId && monthOfISO(t.date) === mk)
    .reduce((s,t) => s + num(t.amount), 0));

  const months = [];
  for (let i = 5; i >= 0; i--) months.push(shiftMonth(mk, -i));
  const series = months.map(m => spentIn(m));
  const max = Math.max(1, ...series);
  // Average only over months you actually used, so a new install doesn't
  // read as "you spend a third of what you really do".
  const active = series.filter(v => v > 0);
  const avg = active.length ? round2(active.reduce((a,b) => a+b, 0) / active.length) : 0;

  let html = `
  <div class="monthnav">
    <button data-month="-1" aria-label="Previous month">${svgChev("left")}</button>
    <div class="m">${esc(monthLabel(mk, true))}</div>
    <button data-month="1" aria-label="Next month">${svgChev("right")}</button>
  </div>

  <div class="tiles" style="margin-top:12px">
    <div class="tile"><div class="t-lab">In</div><div class="t-val num pos">${esc(fmt(income, {compact:true}))}</div></div>
    <div class="tile"><div class="t-lab">Out</div><div class="t-val num">${esc(fmt(spent, {compact:true}))}</div></div>
    <div class="tile"><div class="t-lab">Net</div><div class="t-val num ${income - spent < 0 ? "neg" : "pos"}">${esc(fmt(round2(income - spent), {compact:true}))}</div></div>
  </div>

  <h2 class="sec">Last 6 months<span class="sec-rule"></span></h2>
  <div style="padding-top:6px">
    <div class="chart">
      ${months.map((m, i) => `
        <div class="col" title="${esc(monthLabel(m))}: ${esc(fmt(series[i]))}">
          ${series[i] > 0 && (m === mk || series[i] === max) ? `<div class="cval">${esc(fmt(series[i], {compact:true}).replace(/[.,]00$/, ""))}</div>` : ""}
          <div class="cbar ${m === mk ? "now" : ""}" style="height:${series[i] > 0 ? Math.max(2, series[i] / max * 78) : 0}%"></div>
        </div>`).join("")}
    </div>
    <div class="chart-x">
      ${months.map(m => `<span class="${m === mk ? "now" : ""}">${esc(monthLabel(m).split(" ")[0])}</span>`).join("")}
    </div>
    <div class="spread tiny muted" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)">
      <span>Average${active.length && active.length < series.length ? " (" + active.length + " active month" + (active.length === 1 ? "" : "s") + ")" : ""}</span>
      <b class="num">${esc(fmt(avg, {compact:true}))}/mo</b>
    </div>
  </div>

  <h2 class="sec">Plan vs actual<span class="sec-rule"></span></h2>`;

  if (!rows.length && unassignedSpend === 0) {
    html += `<div class="empty">Nothing recorded for this month.</div>`;
    return html;
  }

  html += `<div class="list">`;
  for (const r of rows) {
    const plan = num(r.c.planned);
    const pct = plan > 0 ? clamp(r.spent / plan * 100, 0, 100) : (r.spent > 0 ? 100 : 0);
    const over = plan > 0 && r.spent > plan;
    html += `
    <div class="item" style="flex-direction:column;align-items:stretch;gap:0;--accent-c:${esc(r.c.color)}">
      <div class="row">
        ${catMark(r.c)}
        <span class="grow">
          <span class="item-title ellip" style="font-size:14.5px">${esc(r.c.name)}</span>
          <div class="item-sub">${plan > 0 ? "of " + esc(fmt(plan, {compact:true})) + " planned" : "no plan set"}</div>
        </span>
        <span class="item-amt num ${over ? "neg" : ""}" style="font-size:15px">${esc(fmt(r.spent, {compact:true}))}</span>
      </div>
      <span class="bar"><i style="width:${pct}%;background:${over ? "var(--neg)" : "var(--ink)"}"></i></span>
    </div>`;
  }
  if (unassignedSpend > 0) {
    html += `
    <div class="item">
      <span class="ico">--</span>
      <span class="grow"><span class="item-title">Unassigned spending</span>
      <div class="item-sub">Not linked to a pocket</div></span>
      <span class="item-amt num">${esc(fmt(unassignedSpend, {compact:true}))}</span>
    </div>`;
  }
  html += `</div>
  <div style="border-top:1px solid var(--ink);margin-top:2px">
    <div class="spread" style="padding:12px 0 6px"><span class="item-sub" style="margin:0">Total planned this month</span><b class="num">${esc(fmt(planned))}</b></div>
    <div class="spread" style="padding-bottom:12px"><span class="item-sub" style="margin:0">Total spent</span><b class="num ${spent > planned && planned > 0 ? "neg" : ""}">${esc(fmt(spent))}</b></div>
  </div>`;
  return html;
}

/* ============================================================
   Sheet plumbing
   ============================================================ */
function openSheet(title, body, opts){
  closeSheet(true);
  const o = opts || {};
  const backdrop = document.createElement("div");
  backdrop.id = "backdrop";
  backdrop.addEventListener("click", () => closeSheet());

  const sheet = document.createElement("div");
  sheet.id = "sheet";
  sheet.setAttribute("role", "dialog");
  sheet.setAttribute("aria-modal", "true");
  sheet.innerHTML = `
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <h3>${esc(title)}</h3>
      ${o.headRight || ""}
      <button class="icon-btn" data-act="closesheet" aria-label="Close">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body">${body}</div>`;

  document.body.appendChild(backdrop);
  document.body.appendChild(sheet);
  document.body.style.overflow = "hidden";
  if (o.focus !== false) {
    const el = sheet.querySelector("input:not([type=file]),select,textarea");
    if (el) setTimeout(() => { el.focus(); if (el.select) el.select(); }, 260);
  }
  return sheet;
}
function closeSheet(silent){
  const b = document.getElementById("backdrop");
  const s = document.getElementById("sheet");
  if (b) b.remove();
  if (s) s.remove();
  if (!silent) document.body.style.overflow = "";
}
function sheetEl(){ return document.getElementById("sheet"); }
function val(sel){ const el = sheetEl() && sheetEl().querySelector(sel); return el ? el.value : ""; }

function toast(msg){
  clearTimeout(toastTimer);
  let t = document.getElementById("toast");
  if (t) t.remove();
  t = document.createElement("div");
  t.id = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 2600);
}

function confirmSheet(title, message, confirmLabel, onConfirm){
  openSheet(title, `
    <p class="small muted" style="margin:0 0 18px">${esc(message)}</p>
    <button class="btn danger" data-confirm-yes>${esc(confirmLabel)}</button>
    <button class="btn" style="margin-top:8px" data-act="closesheet">Cancel</button>
  `, { focus:false });
  sheetEl().querySelector("[data-confirm-yes]").addEventListener("click", () => { closeSheet(); onConfirm(); });
}

/* ---- allocate ---- */
function sheetAllocate(catId){
  const d = derive();
  openSheet("Assign money", `
    <div class="spread" style="padding:16px 0;border-bottom:1px solid var(--ink)">
      <span class="item-sub" style="margin:0">Available to assign</span>
      <b class="num ${d.unassigned < 0 ? "neg" : ""}" style="font-size:19px;font-weight:500">${esc(fmt(d.unassigned))}</b>
    </div>
    ${catSelect("f-cat", catId || (d.cats[0] && d.cats[0].id))}
    ${amountField("", "Amount to move in")}
    <button class="btn primary" data-do="allocate">Assign to pocket</button>
    <button class="btn" style="margin-top:8px" data-do="unallocate">Take back out of pocket</button>
    <button class="btn" style="margin-top:8px" data-act="autofill">Auto-assign everything</button>
  `);
}
function doAllocate(sign){
  const amt = parseAmount(val("#f-amount"));
  const catId = val("#f-cat");
  if (amt <= 0) return toast("Enter an amount above zero");
  if (!catId) return toast("Pick a pocket");
  const cat = state.categories.find(c => c.id === catId);
  addTx({ kind:"allocate", amount: sign * amt, catId, note: sign > 0 ? "" : "returned" });
  closeSheet(); render();
  toast(sign > 0 ? fmt(amt) + " → " + cat.name : fmt(amt) + " back to unassigned");
}
function autoFill(){
  const d = derive();
  let pool = d.unassigned;
  if (pool <= 0.005) { closeSheet(); return toast("Nothing left to assign"); }
  const plan = d.cats.filter(c => num(c.planned) > 0);
  if (!plan.length) { closeSheet(); return toast("Set monthly amounts first"); }

  let filled = 0;
  for (const c of plan) {
    if (pool <= 0.005) break;
    const need = round2(num(c.planned) - (d.balance[c.id] || 0));
    if (need <= 0.005) continue;
    const give = round2(Math.min(need, pool));
    addTx({ kind:"allocate", amount:give, catId:c.id, note:"auto-assign" });
    pool = round2(pool - give);
    filled++;
  }
  closeSheet(); render();
  toast(filled ? "Topped up " + filled + " pocket" + (filled === 1 ? "" : "s") : "Every pocket is already full");
}

/* ---- move between pockets ---- */
function sheetMove(fromId){
  const d = derive();

  openSheet("Move between pockets", `
    ${catSelect("f-from", fromId || d.cats[0].id, { label:"From" })}
    ${catSelect("f-to", d.cats.find(c => c.id !== (fromId || d.cats[0].id)).id, { label:"To" })}

  `);
}
function doMove(){
  const amt = parseAmount(val("#f-amount"));
  const fromId = val("#f-from"), toId = val("#f-to");
  if (amt <= 0) return toast("Enter an amount above zero");
  if (!fromId || !toId || fromId === toId) return toast("Pick two different pockets");
  addTx({ kind:"move", amount:amt, fromId, toId });
  closeSheet(); render();
  const a = state.categories.find(c => c.id === fromId), b = state.categories.find(c => c.id === toId);
  toast(fmt(amt) + ": " + a.name + " → " + b.name);
}

/* ---- bills ---- */
function payBill(catId, mk){
  const cat = state.categories.find(c => c.id === catId);
  if (!cat) return;
  sheetSpend(catId, num(cat.planned), mk);
}
function unpayBill(catId, mk){
  const hits = state.tx.filter(t => t.kind === "expense" && t.catId === catId && t.billPeriod === mk);
  if (!hits.length) return;
  confirmSheet("Undo payment", "This removes " + hits.length + " recorded payment" + (hits.length === 1 ? "" : "s") + " and puts the money back.", "Remove payment", () => {
    const now = Date.now();
    hits.forEach(t => state.tombstones[t.id] = now);
    state.tx = state.tx.filter(t => !(t.kind === "expense" && t.catId === catId && t.billPeriod === mk));
    save(); render(); toast("Payment undone");
  });
}

        ${PALETTE.map(p => `<button type="button" data-color="${esc(p)}" aria-pressed="${c.color===p}" style="background:${esc(p)}"></button>`).join("")}
      </div>
    </div>

    <button class="btn primary" data-do="savecat" data-id="${esc(id || "")}">${id ? "Save changes" : "Create pocket"}</button>
    ${id ? `<button class="btn danger" style="margin-top:8px" data-act="delcat" data-id="${esc(id)}">Delete pocket</button>` : ""}
  `, { focus:false });

  const s = sheetEl();
  let type = c.type, icon = c.icon, color = c.color;

  function syncType(){
    s.querySelectorAll("#f-type [data-type]").forEach(b => b.setAttribute("aria-pressed", b.dataset.type === type));
    s.querySelector("#f-amount-label").textContent = type === "save" ? "Savings goal" : "Monthly amount";
    s.querySelector("#f-monthly-save").hidden = type !== "save";
    s.querySelector("#f-goaldate-wrap").hidden = type !== "save";
    s.querySelector("#f-repeat-wrap").hidden = type !== "spend";
    s.querySelector("#f-due-wrap").hidden = type === "save";
    s.querySelector("#f-type-hint").textContent =
      type === "bill" ? "A fixed payment that repeats — rent, tuition, car, insurance." :
      type === "spend" ? "A monthly budget you draw down — groceries, transport, fun." :
      "A pot you build up towards a goal — savings, emergency fund.";
  }
  syncType();

  function pacePreview(){
    const hint = s.querySelector("#f-pace-hint");
    if (!hint) return;
    const goal = parseAmount(s.querySelector("#f-planned").value);
    const when = s.querySelector("#f-goaldate").value;
    if (type !== "save" || !goal || !/^\d{4}-\d{2}$/.test(when)) { hint.textContent = ""; return; }
    const held = id ? round2(derive().balance[id] || 0) : 0;
    const p = goalPace({ type:"save", goal:goal, goalDate:when, planned:0 }, held);
    const use = s.querySelector("#f-pace-use");
    hint.textContent = p.done ? "Already reached."
      : p.overdue ? "That month has already passed."
      : "That is " + fmt(p.perMonth) + " a month for " + p.monthsLeft +
        " month" + (p.monthsLeft === 1 ? "" : "s") + ".";
    const offer = !p.done && !p.overdue && p.perMonth > 0;
    use.hidden = !offer;
    if (offer) use.dataset.amount = String(p.perMonth);
  }
  function repeatPreview(){
    const hint = s.querySelector("#f-rep-hint");
    if (!hint) return;
    const r = normaliseRepeat({
      amount: parseAmount(s.querySelector("#f-rep-amount").value),
      days: [...s.querySelectorAll('#f-rep-days [aria-pressed="true"]')].map(b => Number(b.dataset.day)),
      start: s.querySelector("#f-rep-start").value
    });
    if (!r) { hint.textContent = "Leave the amount at zero for no repeating charge."; return; }
    const perWeek = round2(r.amount * r.days.length);
    hint.textContent = fmt(perWeek) + " a week · about " + fmt(round2(perWeek * 52 / 12)) +
      " a month. Entries are filled in from " + parseISO(r.start).toLocaleDateString(undefined,
        { day:"numeric", month:"long" }) + " onwards.";
  }
  s.querySelector("#f-rep-days").addEventListener("click", e => {
    const b = e.target.closest("[data-day]"); if (!b) return;
    b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
    repeatPreview();
  });
  s.addEventListener("input", repeatPreview);
  s.querySelector("#f-rep-start").addEventListener("change", repeatPreview);
  repeatPreview();

  const useBtn = s.querySelector("#f-pace-use");
  if (useBtn) useBtn.addEventListener("click", () => {
    s.querySelector("#f-monthly").value = useBtn.dataset.amount || "";
    toast("Monthly amount set to " + fmt(parseAmount(useBtn.dataset.amount)));
  });
  s.addEventListener("input", pacePreview);
  s.querySelector("#f-goaldate").addEventListener("change", pacePreview);
  pacePreview();

  s.querySelector("#f-type").addEventListener("click", e => {
    const b = e.target.closest("[data-type]"); if (!b) return;
    const next = b.dataset.type;
    if (next === type) return;
    // The first field means "monthly amount" for bills/spending but "goal" for
    // savings, so carry the monthly figure across instead of stranding it.
    const first = s.querySelector("#f-planned"), monthly = s.querySelector("#f-monthly");
    if (next === "save" && type !== "save") { monthly.value = first.value; first.value = ""; }
    else if (next !== "save" && type === "save") { first.value = monthly.value; }
    type = next; syncType(); pacePreview();
  });
  s.querySelector("#f-icon").addEventListener("click", e => {
    const b = e.target.closest("[data-emoji]"); if (!b) return;
    icon = b.dataset.emoji;
    s.querySelectorAll("#f-icon [data-emoji]").forEach(x => x.setAttribute("aria-pressed", x.dataset.emoji === icon));
  });
  s.querySelector("#f-color").addEventListener("click", e => {
    const b = e.target.closest("[data-color]"); if (!b) return;
    color = b.dataset.color;
    s.querySelectorAll("#f-color [data-color]").forEach(x => x.setAttribute("aria-pressed", x.dataset.color === color));
  });

  s._draft = () => ({ type, icon, color });
}

function doSaveCategory(id){
  const s = sheetEl();
  const draft = s._draft ? s._draft() : {};
  const name = val("#f-name").trim();
  if (!name) return toast("Give the pocket a name");

  const primary = parseAmount(val("#f-planned"));
  const monthlySave = parseAmount(val("#f-monthly"));
  const dueRaw = val("#f-due");
  const goalDateRaw = val("#f-goaldate");
  const type = draft.type || "spend";
  const repeat = type !== "spend" ? null : normaliseRepeat({
    amount: parseAmount(val("#f-rep-amount")),
    days: [...sheetEl().querySelectorAll('#f-rep-days [aria-pressed="true"]')].map(b => Number(b.dataset.day)),
    start: val("#f-rep-start")
  });

  const patch = {
    name,
    updatedAt: Date.now(),
    icon: draft.icon || "",
    color: draft.color || PALETTE[0],
    type,
    planned: type === "save" ? monthlySave : primary,
    goal: type === "save" ? primary : 0,
    goalDate: type === "save" && /^\d{4}-\d{2}$/.test(goalDateRaw) ? goalDateRaw : null,
    repeat: repeat,
    dueDay: type === "save" || !dueRaw ? null : clamp(parseInt(dueRaw, 10), 1, 31)
  };

  if (id) {
    const c = state.categories.find(x => x.id === id);
    Object.assign(c, patch);
    toast("Saved");
  } else {
    state.categories.push(Object.assign({
      id: uid(),
      order: state.categories.length,
      archived: false
    }, patch));
    toast("Pocket created");
  }
  save();
  const made = runRepeats();
  closeSheet(); render();
  if (made) toast("Filled in " + made + " repeating entr" + (made === 1 ? "y" : "ies"));
}

function deleteCategory(id){
  const c = state.categories.find(x => x.id === id);
  if (!c) return;
  const d = derive();
  const bal = round2(d.balance[id] || 0);
  const used = state.tx.some(t => t.catId === id || t.fromId === id || t.toId === id);
  const msg = used
    ? `"${c.name}" has history, so it will be archived instead of erased.` +
      (Math.abs(bal) > 0.005 ? ` Its ${fmt(bal)} goes back to unassigned.` : "")
    : `"${c.name}" will be removed. It has no history.`;

  confirmSheet("Delete pocket", msg, used ? "Archive pocket" : "Delete pocket", () => {
    if (Math.abs(bal) > 0.005) addTx({ kind:"allocate", amount:-bal, catId:id, note:"pocket closed" });
    if (used) {
      c.archived = true;
      c.updatedAt = Date.now();
    } else {
      state.categories = state.categories.filter(x => x.id !== id);
      state.catTombstones[id] = Date.now();
    }
    save(); render(); toast(used ? "Archived" : "Deleted");
  });
}

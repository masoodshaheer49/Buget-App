/* ---- backup / restore ----
   Opened as an ordinary page, a link with `download` saves the file. Inside
   the Artifact viewer that link is inert, so ask the host to hand the file
   over instead; if neither route works, show the text to copy by hand. */
let downloadsPromise = null;
function getDownloads(){
  if (!hostBridge) return Promise.resolve(null);
  if (!downloadsPromise) downloadsPromise = hostBridge.use("downloads").catch(() => null);
  return downloadsPromise;
}

function exportData(){
  const json = JSON.stringify(state, null, 2);
  const filename = "pockets-backup-" + todayISO() + ".json";

  getDownloads().then(api => {
    if (api) {
      return api.save({ filename, data: json }).then(
        () => toast("Backup saved"),
        err => {
          const code = err && err.code;
          if (code === "declined") return;
          if (code === "rate_limited") return toast("One save at a time — try again in a moment");
          sheetBackupText(json, "Saving a file isn't available here, so copy the text instead.");
        });
    }
    if (hostBridge) return sheetBackupText(json);   // sandboxed: a download link would do nothing
    try {
      const blob = new Blob([json], { type:"application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast("Backup downloaded");
    } catch (e) {
      sheetBackupText(json);
    }
  });
}

const MONO = "font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.5;resize:vertical";

function sheetBackupText(json, why){
  openSheet("Copy your backup", `
    <p class="small muted" style="margin:0 0 12px">${esc(why || "Keep this somewhere safe — a note to yourself, an email, a file.")} Paste it back under <b>Restore from a backup</b> to return to exactly this state.</p>
    <textarea id="f-backup" class="input" rows="9" readonly style="${MONO}">${esc(json)}</textarea>
    <button class="btn primary" style="margin-top:12px" data-do="copybackup">Copy to clipboard</button>
  `, { focus:false });
}
function doCopyBackup(){
  const ta = sheetEl() && sheetEl().querySelector("#f-backup");
  if (!ta) return;
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  const ok = () => toast("Copied — paste it somewhere safe");
  const nope = () => toast("Select the text and copy it manually");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ta.value).then(ok, nope);
  } else {
    try { document.execCommand("copy") ? ok() : nope(); } catch (e) { nope(); }
  }
}

function sheetRestore(){
  openSheet("Restore from a backup", `
    <p class="small muted" style="margin:0 0 14px">This replaces everything currently in the app. Back up first if you're not sure.</p>
    <button class="btn" data-do="pickfile">Choose a backup file</button>
    <input type="file" id="f-import" accept="application/json,.json" hidden>
    <div class="field" style="margin-top:18px">
      <label>Or paste the backup text</label>
      <textarea id="f-paste" class="input" rows="6" placeholder='{"schema":1,"settings":{…}}' style="${MONO}"></textarea>
    </div>
    <button class="btn primary" data-do="pasterestore">Restore from pasted text</button>
  `, { focus:false });
  sheetEl().querySelector("#f-import").addEventListener("change", handleImportFile);
}

function applyRestore(parsed, label){
  if (!parsed || !Array.isArray(parsed.categories)) return toast("That isn't a Pockets backup");
  confirmSheet("Restore backup", "This replaces everything currently in the app with " + label + ".", "Replace my data", () => {
    const incoming = migrate(parsed);
    const now = Date.now();

    // Restore means "this is the truth now". Without saying so explicitly,
    // sync would treat everything the backup omits as news from this device
    // and hand it straight back.
    const keepTx = {}, keepCat = {};
    incoming.tx.forEach(t => keepTx[t.id] = 1);
    incoming.categories.forEach(c => keepCat[c.id] = 1);
    state.tx.forEach(t => { if (!keepTx[t.id]) incoming.tombstones[t.id] = now; });
    state.categories.forEach(c => { if (!keepCat[c.id]) incoming.catTombstones[c.id] = now; });
    incoming.categories.forEach(c => c.updatedAt = now);
    incoming.settings.updatedAt = now;
    LOCAL_SETTINGS.forEach(k => incoming.settings[k] = state.settings[k]);
    incoming.settings.demo = false;

    state = incoming;
    lastPushedSig = null;
    save(); render(); toast("Backup restored");
  });
}
function handleImportFile(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onerror = () => toast("Couldn't read that file");
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); }
    catch (err) { return toast("That file isn't valid JSON"); }
    applyRestore(parsed, file.name);
  };
  reader.readAsText(file);
}
function doPasteRestore(){
  const raw = val("#f-paste").trim();
  if (!raw) return toast("Paste your backup text first");
  let parsed;
  try { parsed = JSON.parse(raw); }
  catch (e) { return toast("That text isn't valid JSON"); }
  applyRestore(parsed, "the pasted backup");
}

function startFresh(){
  confirmSheet("Start fresh",
    "The example figures go away and you start with an empty budget and your ten pockets, ready for your own amounts.",
    "Clear the example", () => {
      state = freshState();
      save(); ui.tab = "home"; render(); toast("All yours — add your money to begin");
    });
}
function resetAll(){
  const everywhere = syncEnabled()
    ? " Because sync is on, it is erased on your other devices too."
    : "";
  confirmSheet("Erase everything",
    "All pockets, amounts and history will be deleted." + everywhere + " This cannot be undone.",
    "Erase everything", () => {
      state = freshState();
      save(); ui.tab = "home"; render(); toast("Fresh start");
    });
}

/* ============================================================
   Repeating charges
   ------------------------------------------------------------
   A bus fare you pay three times a week is not worth typing three
   times a week. A pocket can carry a rule — an amount and the
   weekdays it falls on — and the app fills the entries in when you
   open it, back to the rule's start date.

   The ids are DERIVED from the pocket and the date rather than
   random, which is what makes this safe under sync: your phone and
   your laptop both generate the same id for the same fare, so the
   merge folds them into one entry instead of charging you twice.
   Deleting one leaves a tombstone under that same id, so it stays
   deleted rather than reappearing on the next open.
   ============================================================ */
const REPEAT_BACKFILL_DAYS = 92;

function repeatId(cat, iso){ return "r-" + cat.id + "-" + iso; }

function runRepeats(){
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const seen = {};
  state.tx.forEach(t => seen[t.id] = 1);
  const floor = today.getTime() - REPEAT_BACKFILL_DAYS * 86400000;
  let made = 0;

  state.categories.forEach(c => {
    const r = c.archived ? null : normaliseRepeat(c.repeat);
    if (!r) return;
    const start = parseISO(r.start);
    const from = new Date(Math.max(start.getTime(), floor));
    from.setHours(0, 0, 0, 0);
    for (const d = new Date(from); d <= today; d.setDate(d.getDate() + 1)) {
      if (r.days.indexOf(d.getDay()) < 0) continue;
      const iso = isoOf(d);
      const id = repeatId(c, iso);
      if (seen[id] || state.tombstones[id]) continue;   // already there, or deleted on purpose
      state.tx.push({
        id: id, kind: "expense", amount: r.amount, date: iso, note: c.name,
        catId: c.id, fromId: null, toId: null, billPeriod: null, auto: true
      });
      seen[id] = 1;
      made++;
    }
  });

  if (made) save();
  return made;
}

const DAY_LABELS = ["S", "M", "T", "W", "T", "F", "S"];
const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function repeatSummary(r){
  if (!r) return "";
  const every = r.days.length === 7 ? "every day"
    : r.days.length === 5 && r.days.join() === "1,2,3,4,5" ? "weekdays"
    : r.days.map(d => DAY_NAMES[d]).join(", ");
  return fmt(r.amount, {compact:true}) + " " + every;
}

/* ============================================================
   Quick actions from the URL
   ------------------------------------------------------------
   iOS will not let a web app put a real widget on the home screen —
   that needs a native WidgetKit app. What it does allow is a Shortcut
   that opens a URL, and a Shortcut can sit on the home screen, in the
   widget area, or on Back Tap. So the app accepts its actions as a
   hash, and a Shortcut becomes the quick-capture button:

     #spend=Takeaways&amount=12.50&go     record it and show a receipt
     #spend=Groceries                     open the sheet, pocket chosen
     #add&amount=1000                     money in, ready to confirm

   The hash is consumed on arrival so a refresh cannot fire it twice.
   ============================================================ */
function findCat(key){
  if (!key) return null;
  const k = String(key).trim().toLowerCase();
  const cats = state.categories.filter(c => !c.archived);
  return cats.find(c => c.id === key)
      || cats.find(c => c.name.toLowerCase() === k)
      || cats.find(c => c.name.toLowerCase().indexOf(k) === 0)
      || null;
}

function quickActionURL(action, cat, opts){
  const o = opts || {};
  const base = location.origin + location.pathname;
  let h = "#" + action;
  if (cat) h += "=" + encodeURIComponent(cat.name);
  if (o.ask) h += "&amount=";                    // Shortcut appends the number
  if (o.go) h += "&go";
  return base + h;
}

function runQuickAction(){
  const raw = location.hash.replace(/^#/, "");
  if (!raw) return;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}

  const q = {};
  raw.split("&").forEach(part => {
    if (!part) return;
    const i = part.indexOf("=");
    const key = decodeURIComponent(i < 0 ? part : part.slice(0, i)).toLowerCase();
    q[key] = i < 0 ? "" : decodeURIComponent(part.slice(i + 1).replace(/\+/g, " "));
  });

  const amount = parseAmount(q.amount);
  const note = q.note || "";

  if ("spend" in q) {
    const cat = findCat(q.spend);
    if ("go" in q && amount > 0) {
      addTx({ kind:"expense", amount:amount, catId: cat ? cat.id : null, note:note });
      ui.tab = "home";
      render();
      toast("−" + fmt(amount) + (cat ? " from " + cat.name : ""));
      return;
    }
    sheetSpend(cat ? cat.id : null, amount > 0 ? amount : null);
  } else if ("add" in q) {
    if ("go" in q && amount > 0) {
      addTx({ kind:"income", amount:amount, note:note });
      ui.tab = "home";
      render();
      toast("Added " + fmt(amount));
      return;
    }
    sheetIncome();
    if (amount > 0 && sheetEl()) sheetEl().querySelector("#f-amount").value = String(amount);
  } else if ("assign" in q) {
    const cat = findCat(q.assign);
    sheetAllocate(cat ? cat.id : null);
  } else if ("move" in q) {
    sheetMove();
  }
  if (note && sheetEl()) {
    const nf = sheetEl().querySelector("#f-note");
    if (nf) nf.value = note;
  }
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener("click", e => {
  const tabBtn = e.target.closest("#tabbar [data-tab]");
  if (tabBtn) { ui.tab = tabBtn.dataset.tab; ui.statsMonth = thisMonth(); closeSheet(); render(); return; }

  const jump = e.target.closest("[data-tab-jump]");
  if (jump) { ui.tab = jump.dataset.tabJump; ui.statsMonth = thisMonth(); closeSheet(); render(); return; }

  const filter = e.target.closest("[data-filter]");
  if (filter) { ui.pocketFilter = filter.dataset.filter; render(); return; }

  const month = e.target.closest("[data-month]");
  if (month) { ui.statsMonth = shiftMonth(ui.statsMonth || thisMonth(), Number(month.dataset.month)); render(); return; }

  const openCat = e.target.closest("[data-open-cat]");
  if (openCat) { sheetCategory(openCat.dataset.openCat); return; }

  const openTx = e.target.closest("[data-open-tx]");
  if (openTx) { sheetTx(openTx.dataset.openTx); return; }

  const delTx = e.target.closest("[data-delete-tx]");
  if (delTx) { deleteTx(delTx.dataset.deleteTx); return; }

  const pay = e.target.closest("[data-pay]");
  if (pay) { const [id, mk] = pay.dataset.pay.split("|"); payBill(id, mk); return; }

  const unpay = e.target.closest("[data-unpay]");
  if (unpay) { const [id, mk] = unpay.dataset.unpay.split("|"); unpayBill(id, mk); return; }

  const copyBtn = e.target.closest("[data-copy]");
  if (copyBtn) {
    const text = copyBtn.dataset.copy;
    const field = copyBtn.parentElement.querySelector("input");
    if (field) { field.focus(); field.select(); field.setSelectionRange(0, text.length); }
    const ok = () => toast("Link copied");
    const nope = () => toast("Select the text and copy it manually");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, nope);
    else { try { document.execCommand("copy") ? ok() : nope(); } catch (err) { nope(); } }
    return;
  }

  const restore = e.target.closest("[data-restore]");
  if (restore) {
    const c = state.categories.find(x => x.id === restore.dataset.restore);
    if (c) { c.archived = false; c.updatedAt = Date.now(); save(); closeSheet(); render(); toast(c.name + " restored"); }
    return;
  }

  const doBtn = e.target.closest("[data-do]");
  if (doBtn) {
    const k = doBtn.dataset.do;
    if (k === "income") doIncome();
    else if (k === "allocate") doAllocate(1);
    else if (k === "unallocate") doAllocate(-1);
    else if (k === "spend") doSpend();
    else if (k === "move") doMove();
    else if (k === "savecat") doSaveCategory(doBtn.dataset.id || null);
    else if (k === "saveplan") doSavePlan();
    else if (k === "exampleplan") fillExamplePlan();
    else if (k === "savesettings") doSaveSettings();
    else if (k === "copybackup") doCopyBackup();
    else if (k === "pasterestore") doPasteRestore();
    else if (k === "pickfile") { const f = sheetEl() && sheetEl().querySelector("#f-import"); if (f) f.click(); }
    else if (k === "togglesync") doToggleSync();
    return;
  }

  const act = e.target.closest("[data-act]");
  if (!act) return;
  const id = act.dataset.id;
  switch (act.dataset.act) {
    case "closesheet": closeSheet(); break;
    case "quickadd": sheetQuickAdd(); break;
    case "income": sheetIncome(); break;
    case "allocate": sheetAllocate(); break;
    case "allocate-to": sheetAllocate(id); break;
    case "spend": sheetSpend(); break;
    case "spend-from": sheetSpend(id); break;
    case "move": sheetMove(); break;
    case "move-from": sheetMove(id); break;
    case "autofill": autoFill(); break;
    case "newcat": sheetEditCategory(null); break;
    case "editcat": sheetEditCategory(id); break;
    case "delcat": deleteCategory(id); break;
    case "archived": sheetArchived(); break;
    case "quicklinks": sheetQuickLinks(); break;
    case "plan": sheetPlan(); break;
    case "history": sheetHistory(); break;
    case "settings": sheetSettings(); break;
    case "export": exportData(); break;
    case "import": sheetRestore(); break;
    case "startfresh": startFresh(); break;
    case "reset": resetAll(); break;
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if (e.key === "Enter" && sheetEl() && e.target.tagName === "INPUT" && e.target.type !== "file") {
    const primary = sheetEl().querySelector(".btn.primary[data-do]");
    if (primary) { e.preventDefault(); primary.click(); }
  }
});

/* Keep other tabs / windows of the same app in sync */
window.addEventListener("storage", e => {
  if (e.key === STORAGE_KEY && e.newValue) {
    try { state = migrate(JSON.parse(e.newValue)); render(); } catch (err) {}
  }
});

/* ============================================================
   Boot
   ============================================================ */
state = load();
ui.statsMonth = thisMonth();
render();
startSync();
if (runRepeats()) render();
document.addEventListener("visibilitychange", () => {
  // Reopened after a few days: catch the fares up before anything is read.
  if (!document.hidden && runRepeats()) render();
});
runQuickAction();
window.addEventListener("hashchange", runQuickAction);

/* Follow the device / viewer if they change theme while the app is open. */
if (themeQuery) {
  if (themeQuery.addEventListener) themeQuery.addEventListener("change", applyTheme);
  else if (themeQuery.addListener) themeQuery.addListener(applyTheme);
}
if (window.MutationObserver) {
  new MutationObserver(() => applyTheme())
    .observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });
}


})();
</script>

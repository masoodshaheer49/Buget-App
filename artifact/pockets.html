/* ============================================================
   Pockets — design tokens

   Warm paper, not screen grey. Three voices: Newsreader carries
   every figure, Barlow every sentence, IBM Plex Mono every label
   and date. Rules are dashed, the way a docket is perforated.

   Light is the complete palette; dark redefines the same tokens.
   The effective theme is resolved in JS (app setting > host
   data-theme > OS) and stamped as data-resolved-theme, so every
   colour has exactly one definition per theme.
   ============================================================ */
:root{
  --page:#DCD4C1;        /* behind the app on a wide screen */
  --shell:#E4DDCC;       /* the device ground: header and dock sit on it */
  --paper:#FAF6EC;       /* the docket itself */
  --chip:#F3EBD9;        /* code squares */
  --quiet:#EDE6D8;       /* unpressed pill */
  --quiet-line:#DDD5C2;
  --dash:#C9C0A9;        /* every perforated rule */
  --dot:#B9AE96;         /* halftone ground of a gauge */

  --ink:#2A2622;
  --ink-2:#4A4339;
  --ink-3:#6B6256;
  --ink-4:#6B6558;
  --ink-off:#8A8272;     /* text on a disabled pill */

  --neg:#8E2B29;         /* over your pay */
  --neg-2:#7A3330;
  --neg-bg:#F7DEDC;
  --pos:#26543A;         /* covered */
  --pos-bg:#E2EFE4;
  --warn:#7A4E12;        /* at risk, behind */
  --warn-bg:#F6E7D4;
  --cut:#8C7A53;         /* money cut away to goals */

  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --pad:22px;
  color-scheme:light;
}
:root[data-resolved-theme="dark"]{
  --page:#131110;
  --shell:#1A1714;
  --paper:#23201B;
  --chip:#2E2A23;
  --quiet:#2E2A23;
  --quiet-line:#3E382E;
  --dash:#3A352C;
  --dot:#4A4338;

  --ink:#F2EDE1;
  --ink-2:#CFC6B2;
  --ink-3:#A69C88;
  --ink-4:#9A907D;
  --ink-off:#7A7264;

  --neg:#F0918C;
  --neg-2:#E0A9A4;
  --neg-bg:#3A2523;
  --pos:#8FC79F;
  --pos-bg:#22301F;
  --warn:#E0B070;
  --warn-bg:#352A19;
  --cut:#A8946A;
  color-scheme:dark;
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important;
  }
}

*,*::before,*::after{box-sizing:border-box}
/* The shell is exactly one screen and never scrolls; only the docket inside
   it does. Two heights fighting each other (100% against 100dvh) made the app
   taller than the screen, which pushed the dock off the bottom with no way to
   reach it — so there is one height here, and the page cannot scroll. */
html{height:100%}
body{
  margin:0;height:100vh;height:100dvh;overflow:hidden;
  background:var(--shell);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
/* The darker ground only shows where there is room for it to read as a page. */
@media (min-width:470px){ body{background:var(--page)} }
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Figures are set in the serif, and they line up. */
.fig{font-family:var(--serif);font-variant-numeric:tabular-nums;font-weight:400}
.lab{
  font-family:var(--mono);font-weight:500;font-size:10px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--ink-4);
}
.lab-s{
  font-family:var(--mono);font-weight:500;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
}

/* ============================================================
   Shell — header and dock on the ground, the docket between
   ============================================================ */
#app{
  max-width:430px;margin:0 auto;position:relative;
  height:100%;
  display:flex;flex-direction:column;
  background:var(--shell);overflow:hidden;
}
@media (min-width:470px){ #app{border-inline:1px solid var(--dash)} }

#topbar{
  flex:none;display:flex;align-items:center;gap:9px;
  padding:calc(env(safe-area-inset-top) + 16px) var(--pad) 12px;
}
#topbar .mark{
  font-family:var(--serif);font-size:19px;font-weight:500;
  letter-spacing:-.005em;margin-right:auto;
}
#topbar .when{
  font-family:var(--mono);font-weight:500;font-size:10px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4);
}
#topbar .gear{
  width:30px;height:30px;flex:none;display:grid;place-items:center;
  color:var(--ink-3);border-radius:999px;
}
#topbar .gear:active{background:var(--quiet)}

/* The docket. Scrolls; the scrollbar is hidden because the tear-off
   edge below it is the honest signal that there is more. */
#view{
  flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;
  margin:0 12px;padding:0 var(--pad);
  background:var(--paper);border-radius:20px 20px 0 0;
  box-shadow:0 1px 2px rgba(42,38,34,.05),0 12px 30px rgba(42,38,34,.07);
}
#view::-webkit-scrollbar{width:0;height:0}

/* Perforation: two triangles per 16px, in the ground colour, biting
   into the paper. The docket looks torn from a roll. */
#tear{
  flex:none;height:14px;margin:0 12px;
  background:
    linear-gradient(45deg,var(--shell) 25%,transparent 25%) -8px 0/16px 16px,
    linear-gradient(315deg,var(--shell) 25%,transparent 25%) -8px 0/16px 16px,
    var(--paper);
}

/* The tabs sit right on the safe-area line. Padding above it only pushed the
   whole bar up and left a band of dead ground under it. */
#dock{flex:none;padding:12px var(--pad) calc(env(safe-area-inset-bottom) + 4px)}
.dock-row{display:grid;grid-template-columns:1fr auto;gap:10px}
.dock-tabs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:8px}
.dock-tabs button{
  text-align:center;padding:9px 0 7px;
  font-family:var(--mono);font-weight:500;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  transition:color .14s ease;
}
.dock-tabs button[aria-selected="true"]{color:var(--ink)}

/* ============================================================
   Pills, the only button shape here
   ============================================================ */
.pill{
  border-radius:999px;padding:17px;text-align:center;
  font-size:15px;font-weight:600;letter-spacing:-.005em;
  background:var(--ink);color:var(--paper);
  transition:opacity .12s ease;
}
.pill:active{opacity:.75}
.pill.ghost{background:none;border:1px solid var(--quiet-line);color:var(--ink-2);font-weight:500}
.pill.dead{background:var(--quiet);color:var(--ink-off)}
.pill.sm{padding:11px 16px;font-size:13.5px}
.pill-icon{
  width:56px;display:grid;place-items:center;border-radius:999px;
  border:1px solid var(--ink);color:var(--ink);
}
.pill-icon:active{background:var(--quiet)}

.tag{
  border-radius:999px;padding:5px 11px;white-space:nowrap;
  font-size:12px;font-weight:600;background:var(--quiet);color:var(--ink-2);
}
.tag.ok{background:var(--pos-bg);color:var(--pos)}
.tag.risk{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--neg-bg);color:var(--neg)}

/* ============================================================
   Rows — a dashed rule under each, a dotted leader between
   name and figure, the way a menu sets a price
   ============================================================ */
.sec{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding-bottom:9px;border-bottom:1px dashed var(--dash);
}
.sec .more{font-size:13px;font-weight:500;color:var(--ink-3)}

.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--dash);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.code{
  width:36px;height:36px;flex:none;display:grid;place-items:center;
  border-radius:13px;background:var(--chip);
  font-family:var(--mono);font-weight:500;font-size:11px;
  letter-spacing:.06em;color:var(--ink-3);
}
.row-main{flex:1;min-width:0}
.row-name{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{
  display:block;margin-top:2px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);
}
.row-amt{font-family:var(--serif);font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* the leader line */
.lead{display:flex;align-items:baseline;gap:10px;padding:10px 0;width:100%;text-align:left}
.lead .when{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.08em;color:var(--ink-3);flex:none}
.lead .what{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52%}
.lead .dots{flex:1;border-bottom:1px dotted var(--dash);transform:translateY(-4px);min-width:12px}
.lead .amt{font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums;flex:none}
.lead .undo{
  font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);flex:none;
}

/* ============================================================
   Gauges — halftone ground, hatched fill. No solid bars.
   ============================================================ */
.gauge{display:flex;height:14px;background:radial-gradient(var(--dot) 1.05px,transparent 1.15px) 0 0/5px 5px}
.gauge.tall{height:18px}
.gauge i{display:block}
.hatch-ink{background:repeating-linear-gradient(90deg,var(--ink) 0 7px,var(--paper) 7px 9px)}
.hatch-cut{background:repeating-linear-gradient(90deg,var(--cut) 0 7px,var(--paper) 7px 9px)}
.hatch-neg{background:repeating-linear-gradient(90deg,var(--neg) 0 7px,var(--paper) 7px 9px)}

/* ============================================================
   Sheets — paper sliding up over the docket
   ============================================================ */
#backdrop{position:absolute;inset:0;z-index:60;background:rgba(42,38,34,.5);animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
#sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:61;
  background:var(--paper);border-radius:22px 22px 0 0;
  padding:0 var(--pad) calc(env(safe-area-inset-bottom) + 22px);
  max-height:94%;display:flex;flex-direction:column;
  box-shadow:0 -8px 40px rgba(42,38,34,.28);
  animation:up .26s cubic-bezier(.22,1,.36,1);
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-head{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 0 12px;
}
.sheet-head h3{margin:0;font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:-.01em}
.sheet-head .close{
  font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);
}
/* A sheet never scrolls sideways. iOS gives input[type=date] an intrinsic
   width that ignores width:100%, which quietly made the body wider than the
   screen — so the amount and the pills slid out of view. */
.sheet-body{overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.sheet-body::-webkit-scrollbar{width:0}
.say{font-size:13.5px;color:var(--ink-3);padding-top:12px}
.say.warn{color:var(--warn)}

/* the big amount being typed */
.amount{display:flex;align-items:baseline;gap:8px;padding-bottom:9px;border-bottom:2px solid var(--ink)}
.amount .cur{font-family:var(--serif);font-size:22px;color:var(--ink-3)}
.amount .val{
  flex:1;font-family:var(--serif);font-size:42px;font-weight:500;
  letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;
  min-width:0;overflow:hidden;
}

.keys{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px}
.keys button{
  padding:14px 0;text-align:center;
  font-family:var(--mono);font-weight:500;font-size:20px;
  border-bottom:1px dashed var(--dash);
}
.keys button:active{background:var(--quiet)}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips button{
  border-radius:999px;padding:9px 13px;font-size:13.5px;font-weight:500;
  background:var(--quiet);color:var(--ink-2);border:1px solid var(--quiet-line);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.field{margin-top:11px}
.field > label{display:block;margin-bottom:7px}
.input{
  width:100%;min-width:0;max-width:100%;padding:12px 14px;border-radius:14px;
  border:1px solid var(--quiet-line);background:var(--paper);
  font-size:16px;outline:none;
}
/* Left like every other field, and stripped of the platform's own sizing. */
input[type="date"].input{-webkit-appearance:none;appearance:none;text-align:left}
.input:focus{border-color:var(--ink)}
select.input{appearance:none}
textarea.input{font-family:var(--mono);font-size:11.5px;line-height:1.5;resize:vertical}

.note{
  display:flex;gap:11px;margin-top:14px;padding:13px 14px;
  background:var(--neg-bg);border-radius:16px;
}
.note .bang{font-family:var(--serif);font-size:19px;color:var(--neg);line-height:1.1}
.note b{display:block;font-size:14px;font-weight:600;color:var(--neg);letter-spacing:-.01em}
.note span > span{display:block;font-size:13px;line-height:1.45;color:var(--neg-2);margin-top:3px}
/* Still in the black, but a bill ahead will not clear. */
.note.risk{background:var(--warn-bg)}
.note.risk .bang,.note.risk b{color:var(--warn)}
.note.risk span > span{color:var(--ink-2)}

.empty{
  padding:30px 0;color:var(--ink-3);font-size:14px;line-height:1.6;
  border-bottom:1px dashed var(--dash);
}

.setrow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:15px 0;border-bottom:1px dashed var(--dash);
}
.setrow:last-of-type{border-bottom:0}
.setrow b{font-weight:600;font-size:15px}
.setrow .sub{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.green{background:var(--pos)} .dot.amber{background:var(--warn)} .dot.red{background:var(--neg)}

#toast{
  position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 152px);   /* clear of the dock */
  transform:translateX(-50%);z-index:90;max-width:86%;text-align:center;
  background:var(--ink);color:var(--paper);
  padding:11px 16px;border-radius:999px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;
  animation:tin .18s ease;
}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

#demobar{
  display:flex;align-items:center;gap:12px;
  padding:13px 0;border-bottom:1px dashed var(--dash);
}
#demobar .t{flex:1;min-width:0;font-size:12.5px;line-height:1.4;color:var(--ink-3)}
#demobar .t b{display:block;font-family:var(--mono);font-size:10px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--warn);margin-bottom:3px}
#demobar button{
  flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--warn);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);
}

[hidden]{display:none !important}

<!-- Resolve the theme before any content paints: the app's own setting wins,
     then a host that stamps data-theme (the Artifact viewer), then the OS. -->
<script>
(function(){
  function resolve(){
    try {
      var raw = localStorage.getItem("pockets.budget.v1");
      if (raw) {
        var t = (JSON.parse(raw).settings || {}).theme;
        if (t === "dark" || t === "light") return t;
      }
    } catch (e) {}
    var host = document.documentElement.getAttribute("data-theme");
    if (host === "dark" || host === "light") return host;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-resolved-theme", resolve());
})();
</script>

<script>
"use strict";
/* ============================================================
   Constants
   ============================================================ */
const STORAGE_KEY = "pockets.budget.v1";
const SCHEMA = 2;
const SYNC_DOC = "budget/state";
const TOMBSTONE_TTL = 365 * 24 * 3600 * 1000;

const CURRENCIES = [
  { code:"EUR", symbol:"€", locale:"en-IE" },
  { code:"GBP", symbol:"£", locale:"en-GB" },
  { code:"USD", symbol:"$", locale:"en-US" },
  { code:"PKR", symbol:"₨", locale:"en-PK" }
];

const DEFAULT_LABELS = ["Coffee", "Groceries", "Transport", "Takeaway", "Bills"];
/* Where money comes from. Tips and salary are different animals: one is
   the plan, the other is what the day happened to give you.
   WHO is the sentinel for "someone gave it to me" — the name is typed. */
const WHO = "~who";
const DEFAULT_INCOME = ["Tips", "Salary"];
const OTHER = "Other";

const TABS = ["Home", "Goals", "Bills", "Spending"];

/* ============================================================
   State

   One `items` array holds goals, bills and repeating charges, so
   the sync merge has a single rule for all three. Balances are
   never stored: derive() recomputes from the transaction log.
   ============================================================ */
let state = null;
let ui = { tab:"home", sheet:null, pad:"", label:"", other:"", borrow:"", src:"",
           date:"", pick:false, goalIx:0, seeAll:false };
let toastTimer = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function defaultState(){
  const now = Date.now();
  return {
    schema: SCHEMA,
    settings: {
      currency:"EUR", theme:"auto", name:"", demo:false, sync:true,
      labels: DEFAULT_LABELS.slice(),
      income: DEFAULT_INCOME.slice(),
      payday:null,          // "YYYY-MM-DD" of the next pay, or null
      payEvery:30,          // days between pays
      updatedAt: now
    },
    items: [],              // goal | bill | repeat
    tx: [],
    tombstones: {},         // txId  -> deleted-at ms
    itemTombstones: {}      // itemId -> deleted-at ms
  };
}

function mkItem(patch){
  return Object.assign({
    id: uid(), type:"goal", name:"Untitled", code:"", order:0, archived:false,
    updatedAt: Date.now(),
    /* goal */ kind:"save", target:0, targetDate:null,
    /* bill */ amount:0, dueDay:null, cycleDays:null, cycleStart:null,
    /* repeat */ days:[], from:null
  }, patch);
}

/** A cleared budget that also tells other devices what was cleared. */
function freshState(){
  const now = Date.now();
  const next = defaultState();
  next.tombstones = Object.assign({}, state ? state.tombstones : null);
  next.itemTombstones = Object.assign({}, state ? state.itemTombstones : null);
  if (state) {
    state.tx.forEach(t => next.tombstones[t.id] = now);
    state.items.forEach(i => next.itemTombstones[i.id] = now);
    ["currency","theme","name","sync"].forEach(k => next.settings[k] = state.settings[k]);
  }
  return next;
}

/**
 * A worked example, used only on a first run so the app opens showing what it
 * does instead of an empty docket. Flagged `demo` so a banner says so, and one
 * tap replaces it with an empty budget.
 */
function demoState(){
  const s = defaultState();
  s.settings.demo = true;
  const today = new Date();
  const back = n => { const d = new Date(today); d.setDate(d.getDate() - n); return isoOf(d); };
  const fwd = n => { const d = new Date(today); d.setDate(d.getDate() + n); return isoOf(d); };

  const tuition = mkItem({ type:"goal", kind:"save", name:"Tuition", code:"TU", order:0,
    target:4600, targetDate:shiftMonth(thisMonth(), 12) });
  const sister = mkItem({ type:"goal", kind:"debt", name:"Owes sister", code:"OM", order:1,
    target:110, targetDate:null });
  const phone = mkItem({ type:"bill", name:"Phone", code:"PH", order:2,
    amount:20, cycleDays:28, cycleStart:fwd(17) });
  s.items = [tuition, sister, phone];

  const push = t => s.tx.push(Object.assign({ id:uid(), date:todayISO(), note:"", label:"", itemId:null, billPeriod:null, auto:false }, t));
  push({ kind:"income", amount:1200, date:back(13), note:"Starting money" });
  push({ kind:"allocate", amount:450, itemId:tuition.id, date:back(12), note:"Cut to Tuition" });
  push({ kind:"allocate", amount:22.56, itemId:sister.id, date:back(9), note:"Repaid" });
  [[8.25,"Coffee",0],[15,"Transport",0],[31.40,"Groceries",2],[26,"Transport",3],
   [14.90,"Takeaway",4],[18.30,"Groceries",6],[3.60,"Coffee",8],[8.30,"Other",9]]
    .forEach(([amt, label, ago]) => push({ kind:"expense", amount:amt, label, date:back(ago) }));
  return s;
}

function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { console.warn("Could not read saved data", e); }
  try { return demoState(); } catch (e) { return defaultState(); }
}

/**
 * Schema 1 kept ten pockets, each with a type and a monthly amount, and every
 * expense pointed at one. Schema 2 keeps only what holds money — goals — plus
 * a list of bills that hold nothing, and tags spending with a plain label.
 *
 * Money is conserved: a pocket that is dissolved has its balance released back
 * with a recorded entry, never silently dropped, so the log still adds up.
 */
function migrate(data){
  if (!data || typeof data !== "object") return defaultState();
  const base = defaultState();
  const s = {
    schema: SCHEMA,
    settings: Object.assign({}, base.settings, data.settings || {}),
    items: Array.isArray(data.items) ? data.items : [],
    tx: Array.isArray(data.tx) ? data.tx : []
  };
  if (["auto","dark","light"].indexOf(s.settings.theme) < 0) s.settings.theme = "auto";
  s.settings.demo = !!s.settings.demo;
  s.settings.sync = s.settings.sync !== false;
  s.settings.updatedAt = num(s.settings.updatedAt);
  s.settings.payEvery = clamp(Math.round(num(s.settings.payEvery)) || 30, 1, 365);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s.settings.payday || "")) s.settings.payday = null;
  s.settings.labels = Array.isArray(s.settings.labels) && s.settings.labels.length
    ? s.settings.labels.map(String).filter(l => l && l !== OTHER).slice(0, 12)
    : DEFAULT_LABELS.slice();
  s.settings.income = Array.isArray(s.settings.income) && s.settings.income.length
    ? s.settings.income.map(String).filter(Boolean).slice(0, 8)
    : DEFAULT_INCOME.slice();
  s.tombstones = tsMap(data.tombstones);
  s.itemTombstones = tsMap(data.itemTombstones || data.catTombstones);

  s.tx = s.tx.filter(t => t && t.id && t.kind).map(t => ({
    id: t.id,
    kind: t.kind,                        // income | expense | allocate
    amount: num(t.amount),
    date: t.date || todayISO(),
    note: t.note ? String(t.note) : "",
    label: t.label ? String(t.label) : "",
    auto: !!t.auto,
    itemId: t.itemId || null,            // allocate target (a goal)
    billPeriod: t.billPeriod || null     // set when this expense settles a bill occurrence
  }));

  if (num(data.schema) < 2 && Array.isArray(data.categories)) foldPockets(data, s);

  s.items = s.items.map((c, i) => mkItem({
    id: c.id || uid(),
    updatedAt: num(c.updatedAt),
    order: typeof c.order === "number" ? c.order : i,
    type: ["goal","bill","repeat"].includes(c.type) ? c.type : "goal",
    name: String(c.name || "Untitled"),
    code: String(c.code || "").slice(0, 3),
    kind: c.kind === "debt" ? "debt" : "save",
    target: num(c.target),
    targetDate: /^\d{4}-\d{2}$/.test(c.targetDate || "") ? c.targetDate : null,
    amount: num(c.amount),
    dueDay: c.dueDay == null ? null : clamp(Math.round(num(c.dueDay)), 1, 31),
    cycleDays: clamp(Math.round(num(c.cycleDays)), 0, 365) || null,
    cycleStart: /^\d{4}-\d{2}-\d{2}$/.test(c.cycleStart || "") ? c.cycleStart : null,
    days: Array.isArray(c.days) ? c.days.map(Number).filter(d => d >= 0 && d <= 6) : [],
    from: /^\d{4}-\d{2}-\d{2}$/.test(c.from || "") ? c.from : null,
    archived: !!c.archived
  }));
  s.items.forEach(i => { if (!i.code) i.code = codeFor(i.name, s.items); });
  return s;
}

/** Schema 1 -> 2. Runs once, against whatever that device actually held. */
function foldPockets(old, s){
  const now = Date.now();
  const cats = old.categories.filter(c => c && c.id);
  const held = {};
  cats.forEach(c => held[c.id] = 0);
  (old.tx || []).forEach(t => {
    const amt = num(t.amount);
    if (t.kind === "expense" && t.catId && held[t.catId] !== undefined) held[t.catId] -= amt;
    else if (t.kind === "allocate" && t.catId && held[t.catId] !== undefined) held[t.catId] += amt;
    else if (t.kind === "move") {
      if (t.fromId && held[t.fromId] !== undefined) held[t.fromId] -= amt;
      if (t.toId && held[t.toId] !== undefined) held[t.toId] += amt;
    }
  });

  const nameOf = {};
  cats.forEach(c => nameOf[c.id] = String(c.name || "Untitled"));
  const labels = [];

  cats.forEach((c, i) => {
    const bal = round2(held[c.id] || 0);
    if (c.type === "save") {
      s.items.push(mkItem({ id:c.id, type:"goal", kind:"save", name:nameOf[c.id], order:i,
        target:num(c.goal), targetDate:c.goalDate || null, archived:!!c.archived, updatedAt:now }));
      return;                                   // keeps its money
    }
    if (c.type === "bill") {
      s.items.push(mkItem({ id:c.id, type:"bill", name:nameOf[c.id], order:i,
        amount:num(c.planned), dueDay:c.dueDay || null,
        cycleDays:num(c.cycleDays) || null, cycleStart:c.cycleStart || null,
        archived:!!c.archived, updatedAt:now }));
    } else {
      labels.push(nameOf[c.id]);                // dissolved into a label
    }
    if (Math.abs(bal) > 0.005) release(s, c.id, bal, now);
  });

  // Old per-pocket repeating charges become per-label ones.
  cats.forEach((c, i) => {
    const r = c.repeat;
    if (!r || !num(r.amount) || !Array.isArray(r.days) || !r.days.length) return;
    s.items.push(mkItem({ id:uid(), type:"repeat", name:nameOf[c.id], order:100 + i,
      amount:num(r.amount), days:r.days.map(Number), from:r.from || null, updatedAt:now }));
  });

  // Every past expense keeps its meaning by carrying its pocket's name.
  s.tx.forEach(t => {
    const src = (old.tx || []).find(o => o.id === t.id);
    if (!src) return;
    if (t.kind === "expense" && !t.label) t.label = nameOf[src.catId] || OTHER;
    if (t.kind === "allocate") t.itemId = src.catId || null;
    if (t.kind === "move") { t.kind = "allocate"; t.itemId = src.toId || null; }
  });
  // A move's other leg: the source pocket gave the money up.
  (old.tx || []).filter(t => t.kind === "move" && t.fromId).forEach(t => {
    s.tx.push({ id:"m-" + t.id, kind:"allocate", amount:-num(t.amount), date:t.date || todayISO(),
      note:t.note || "Moved", label:"", auto:false, itemId:t.fromId, billPeriod:null });
  });
  // Entries that pointed at a pocket that is now a bill or a label hold nothing.
  const goalIds = {};
  s.items.forEach(i => { if (i.type === "goal") goalIds[i.id] = true; });
  s.tx = s.tx.filter(t => t.kind !== "allocate" || goalIds[t.itemId]);

  const seen = {};
  s.settings.labels = DEFAULT_LABELS.concat(labels)
    .filter(l => l && l !== OTHER && !seen[l.toLowerCase()] && (seen[l.toLowerCase()] = true))
    .slice(0, 12);
}

/** Give a dissolved pocket's money back to the balance, on the record. */
function release(s, catId, bal, now){
  s.tx.push({ id:"rel-" + catId, kind:"allocate", amount:-bal, date:todayISO(),
    note:"Released when pockets became goals", label:"", auto:false, itemId:catId, billPeriod:null });
}

function tsMap(raw){
  const out = {};
  if (!raw || typeof raw !== "object") return out;
  const cutoff = Date.now() - TOMBSTONE_TTL;
  Object.keys(raw).forEach(k => { const v = num(raw[k]); if (v > cutoff) out[k] = v; });
  return out;
}
function newestTombstones(a, b){
  const out = Object.assign({}, a);
  Object.keys(b || {}).forEach(k => { if (!out[k] || b[k] > out[k]) out[k] = b[k]; });
  return out;
}

let saveTimer = null;
/** Persist to this device only — used when applying something that just
    arrived from another device, so it doesn't bounce straight back. */
function saveLocal(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { toast("Couldn't save — storage is full or blocked"); }
  }, 60);
}
function save(){ saveLocal(); schedulePush(); }

/* ============================================================
   Small helpers
   ============================================================ */
function num(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }
function clamp(n, lo, hi){ return Math.min(hi, Math.max(lo, n)); }
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }

function todayISO(){ return isoOf(new Date()); }
function isoOf(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parseISO(s){ const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); }
function monthKeyOf(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function thisMonth(){ return monthKeyOf(new Date()); }
function monthOfISO(iso){ return String(iso).slice(0,7); }
function shiftMonth(mk, delta){
  const [y, m] = mk.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return monthKeyOf(d);
}
function monthLabel(mk, long){
  const [y, m] = String(mk).split("-").map(Number);
  return new Date(y, (m||1)-1, 1).toLocaleDateString(undefined, { month: long ? "long" : "short", year:"numeric" });
}
function daysBetween(a, b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }

function currencyMeta(){
  return CURRENCIES.find(c => c.code === state.settings.currency) || CURRENCIES[0];
}
/** Bare number, grouped, always two decimals. The symbol is set separately so
    it can be given its own size in the serif. */
function fmt(n, opts){
  const o = opts || {};
  const v = round2(num(n));
  const c = currencyMeta();
  const body = Math.abs(v).toLocaleString(c.locale, {
    minimumFractionDigits: o.whole ? 0 : 2, maximumFractionDigits: o.whole ? 0 : 2
  });
  return (v < 0 ? "−" : "") + (o.bare ? "" : c.symbol) + body;
}
function fmtParts(n){
  const c = currencyMeta();
  const v = round2(num(n));
  const body = Math.abs(v).toLocaleString(c.locale, { minimumFractionDigits:2, maximumFractionDigits:2 });
  const cut = body.lastIndexOf(body.indexOf(",") > body.indexOf(".") ? "," : ".");
  return { sign: v < 0 ? "−" : "", symbol: c.symbol, main: body.slice(0, cut), cents: body.slice(cut) };
}
function parseAmount(str){
  let s = String(str || "").replace(/[^\d.,-]/g, "").trim();
  if (!s) return 0;
  const lastComma = s.lastIndexOf(","), lastDot = s.lastIndexOf(".");
  if (lastComma > -1 && lastDot > -1) {
    s = lastComma > lastDot ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  } else if (lastComma > -1) {
    s = s.length - lastComma - 1 === 3 && !/,\d{1,2}$/.test(s) ? s.replace(/,/g, "") : s.replace(",", ".");
  }
  const n = parseFloat(s);
  return Number.isFinite(n) ? round2(n) : 0;
}
function relDay(iso){
  const diff = daysBetween(todayISO(), iso);
  if (diff === 0) return "Today";
  if (diff === -1) return "Yest";
  if (diff === 1) return "Tmrw";
  return parseISO(iso).toLocaleDateString(undefined, { day:"numeric", month:"short" });
}
/** Two or three letters from the name — a banking convention, and far more
    legible at 36px than a tinted emoji. Widens on collision. */
function codeFor(name, all){
  const parts = String(name || "").replace(/[^\p{L}\p{N}]+/gu, " ").trim().split(/\s+/).filter(Boolean);
  let base = parts.length >= 2 ? (parts[0][0] + parts[1][0]) : (parts[0] || "?").slice(0, 2);
  base = base.toUpperCase();
  const taken = {};
  (all || []).forEach(i => { if (i.code && i.name !== name) taken[i.code] = true; });
  if (!taken[base]) return base;
  const wide = ((parts[0] || "?").slice(0, 3)).toUpperCase();
  return taken[wide] ? base : wide;
}

/* ============================================================
   Derived values — recomputed on every render. The single source
   of truth is the transaction log.
   ============================================================ */
function derive(){
  const items = state.items.filter(i => !i.archived).sort((a,b) => a.order - b.order);
  const held = {};
  state.items.forEach(i => { if (i.type === "goal") held[i.id] = 0; });

  let cash = 0, cuts = 0;
  for (const t of state.tx) {
    const amt = num(t.amount);
    if (t.kind === "income") cash += amt;
    else if (t.kind === "expense") cash -= amt;
    else if (t.kind === "allocate" && held[t.itemId] !== undefined) { held[t.itemId] += amt; cuts += amt; }
  }
  Object.keys(held).forEach(k => held[k] = round2(held[k]));

  /* Money cut to a savings goal is spoken for but has not gone anywhere - it is
     still in the account, and it turns up in a hand count. Money cut to a debt
     goal has left the account, because cutting to a debt *is* the payment. So
     only the first kind is added back to work out what you should be holding. */
  let saved = 0;
  state.items.forEach(i => {
    if (i.type === "goal" && i.kind !== "debt") saved += held[i.id] || 0;
  });

  const left = round2(cash - cuts);
  return {
    items, held,
    goals: items.filter(i => i.type === "goal"),
    bills: items.filter(i => i.type === "bill"),
    repeats: items.filter(i => i.type === "repeat"),
    cash: round2(cash),
    cuts: round2(cuts),
    left,                              // the hero: what is actually spendable
    saved: round2(saved),              // spoken for, still in your pocket
    onHand: round2(left + saved)       // what a hand count should come to
  };
}

function spentIn(mk){
  let total = 0;
  for (const t of state.tx) if (t.kind === "expense" && monthOfISO(t.date) === mk) total += num(t.amount);
  return round2(total);
}
/** This month's money in, grouped by where it came from. Borrowed money is
    grouped under the goal it belongs to, so a wage and a loan never blur. */
function incomeBy(mk){
  const g = {};
  state.tx.forEach(t => {
    if (t.kind !== "income" || monthOfISO(t.date) !== mk) return;
    const name = (t.label || "").trim()
      || (t.note && /^Borrowed from /.test(t.note) ? t.note.replace(/^Borrowed from /, "Borrowed · ") : "")
      || "Money in";
    const k = name.toLowerCase();
    if (!g[k]) g[k] = { label:name, total:0, count:0 };
    g[k].total = round2(g[k].total + num(t.amount));
    g[k].count++;
  });
  return g;
}

function incomeSince(iso){
  let total = 0;
  for (const t of state.tx) if (t.kind === "income" && t.date >= iso) total += num(t.amount);
  return round2(total);
}
function spentSince(iso){
  let total = 0;
  for (const t of state.tx) if (t.kind === "expense" && t.date >= iso) total += num(t.amount);
  return round2(total);
}

/**
 * How fast money is actually leaving, over a window of at most the last 30
 * days. Spending only, never netted against income — netting would let a
 * one-off lump, the very money being counted down, pass for a wage.
 */
function burnRate(){
  let firstISO = null;
  state.tx.forEach(t => { if (!firstISO || t.date < firstISO) firstISO = t.date; });
  if (!firstISO) return { days:0, spent:0, perDay:0 };
  const span = clamp(daysBetween(firstISO, todayISO()) + 1, 1, 30);
  const from = new Date(); from.setDate(from.getDate() - span + 1);
  const fromISO = isoOf(from);
  let spent = 0;
  state.tx.forEach(t => { if (t.kind === "expense" && t.date >= fromISO && t.date <= todayISO()) spent += num(t.amount); });
  return { days: span, spent: round2(spent), perDay: round2(spent / span) };
}

/** The pay period you are inside: payday-to-payday when one is set, else the
    calendar month. Gives the denominator for the bar at the foot of Home. */
function payPeriod(){
  const pd = state.settings.payday;
  const every = clamp(Math.round(num(state.settings.payEvery)) || 30, 1, 365);
  if (pd) {
    // Step the stored payday back to the last one that has already happened.
    let next = pd;
    while (daysBetween(todayISO(), next) > 0) {
      const d = parseISO(next); d.setDate(d.getDate() - every); next = isoOf(d);
    }
    while (daysBetween(todayISO(), next) <= -every) {
      const d = parseISO(next); d.setDate(d.getDate() + every); next = isoOf(d);
    }
    const after = parseISO(next); after.setDate(after.getDate() + every);
    return { from: next, nextPay: isoOf(after), daysLeft: Math.max(0, daysBetween(todayISO(), isoOf(after))), dated: true };
  }
  const d = new Date(); d.setDate(1);
  return { from: isoOf(d), nextPay: null, daysLeft: 0, dated: false };
}

/* ---- bills ----
   Two shapes. A monthly bill falls on a day of the month and is keyed by that
   month ("2026-10"); a cycle bill falls every N days from a start date and is
   keyed by its own date ("2026-10-30"), because a month can hold two of them.
   Both go in the same billPeriod field, so records written before cycles
   existed stay valid. Bills hold no money — they are listed, not reserved. */
function isCycle(b){ return num(b.cycleDays) > 0 && !!b.cycleStart; }

function billPaid(b, period){
  return state.tx.some(t => t.kind === "expense" && t.billPeriod === period && t.itemId === b.id);
}

/** Every occurrence from today forward, across all bills, soonest first. */
function billsAhead(bills, horizonDays){
  const out = [];
  const today = todayISO();
  const limit = new Date(); limit.setDate(limit.getDate() + (horizonDays || 75));
  const limitISO = isoOf(limit);

  bills.forEach(b => {
    if (isCycle(b)) {
      const step = clamp(Math.round(num(b.cycleDays)), 1, 365);
      let d = parseISO(b.cycleStart);
      // Walk forward from the start; never emit a date before it.
      let guard = 0;
      while (isoOf(d) < today && guard++ < 4000) d.setDate(d.getDate() + step);
      while (isoOf(d) <= limitISO && guard++ < 4000) {
        out.push({ item:b, iso:isoOf(d), period:isoOf(d) });
        d.setDate(d.getDate() + step);
      }
    } else if (b.dueDay) {
      for (let k = 0; k < 4; k++) {
        const mk = shiftMonth(thisMonth(), k);
        const [y, m] = mk.split("-").map(Number);
        const last = new Date(y, m, 0).getDate();
        const iso = isoOf(new Date(y, m - 1, clamp(b.dueDay, 1, last)));
        if (iso >= today && iso <= limitISO) out.push({ item:b, iso, period:mk });
      }
    }
  });
  out.sort((a, z) => a.iso < z.iso ? -1 : a.iso > z.iso ? 1 : 0);
  return out.map(o => Object.assign(o, { paid: billPaid(o.item, o.period) }));
}

/**
 * Walk down the unpaid bills taking each out of what is left. The first one
 * that does not clear is at risk, and is what the warning on Home names —
 * a per-bill answer rather than a single "you are short" for the whole list.
 */
function annotateRisk(rows, left){
  let running = left;
  let firstRisk = null;
  rows.forEach(r => {
    if (r.paid) { r.tag = "Paid"; r.cls = ""; return; }
    running = round2(running - num(r.item.amount));
    r.ok = running >= -0.005;
    r.tag = r.ok ? "Covered" : "At risk";
    r.cls = r.ok ? "ok" : "risk";
    if (!r.ok && !firstRisk) firstRisk = { row:r, gap: Math.abs(running) };
  });
  return firstRisk;
}

/* ---- goals ---- */
function goalFigure(g, saved){
  return g.kind === "debt" ? round2(num(g.target) - saved) : saved;
}
/** What a dated goal asks of you per month — "€4,600 by September" means
    nothing until it reads "€383 a month, and you are €50 behind". */
function goalPace(g, saved){
  if (num(g.target) <= 0 || !g.targetDate) return null;
  const [y, m] = g.targetDate.split("-").map(Number);
  const now = new Date();
  const monthsLeft = (y - now.getFullYear()) * 12 + (m - 1 - now.getMonth());
  const remaining = round2(Math.max(0, num(g.target) - saved));
  return {
    monthsLeft, remaining,
    perMonth: monthsLeft > 0 ? round2(remaining / monthsLeft) : remaining,
    done: remaining <= 0.005,
    overdue: monthsLeft <= 0 && remaining > 0.005,
    label: monthLabel(g.targetDate)
  };
}

/* ---- repeating charges ----
   A fare paid three times a week is not worth typing three times a week. The
   generated ids are derived from the rule and the date rather than random,
   which is what makes this safe under sync: two devices produce the same id
   for the same fare, so the merge folds them into one entry. */
function repeatId(r, iso){ return "r-" + r.id + "-" + iso; }

function runRepeats(){
  const rules = state.items.filter(i => i.type === "repeat" && !i.archived && num(i.amount) > 0 && i.days.length);
  if (!rules.length) return 0;
  const have = {};
  state.tx.forEach(t => have[t.id] = true);
  const today = todayISO();
  let made = 0;

  rules.forEach(r => {
    const start = r.from && r.from > isoBack(92) ? r.from : isoBack(92);
    let d = parseISO(start);
    let guard = 0;
    while (isoOf(d) <= today && guard++ < 400) {
      const iso = isoOf(d);
      if (r.days.indexOf(d.getDay()) >= 0 && (!r.from || iso >= r.from)) {
        const id = repeatId(r, iso);
        if (!have[id] && !state.tombstones[id]) {
          state.tx.push({ id, kind:"expense", amount:num(r.amount), date:iso,
            note:"", label:r.name, auto:true, itemId:null, billPeriod:null });
          made++;
        }
      }
      d.setDate(d.getDate() + 1);
    }
  });
  return made;
}
function isoBack(n){ const d = new Date(); d.setDate(d.getDate() - n); return isoOf(d); }

/* ============================================================
   Sync (Artifact builds only)

   The whole budget lives in one document, but devices MERGE rather
   than overwrite: transactions union by id minus tombstones, items
   keep the copy with the newer updatedAt, settings are whole-object
   newest-wins. Each rule gives the same answer whichever order the
   devices apply it in, so both converge on the same budget.
   ============================================================ */
const hostBridge = (window.claude && typeof window.claude.use === "function") ? window.claude : null;
let syncRef = null, syncUnsub = null, lastPushedSig = null, pushTimer = null, syncRetry = 0;
let syncState = hostBridge ? "connecting" : "unsupported";
let syncedAt = 0;

function canon(v){
  if (Array.isArray(v)) return v.map(canon);
  if (v && typeof v === "object") {
    const out = {};
    Object.keys(v).sort().forEach(k => out[k] = canon(v[k]));
    return out;
  }
  return v;
}
/** Device-local settings are never pushed: your laptop can be light while
    your phone is dark, and turning sync off on one must not turn it off on
    the other. */
const LOCAL_SETTINGS = ["theme", "sync", "demo"];

function syncPayload(s){
  const settings = {};
  Object.keys(s.settings).forEach(k => { if (LOCAL_SETTINGS.indexOf(k) < 0) settings[k] = s.settings[k]; });
  return { schema: SCHEMA, settings, items: s.items, tx: s.tx,
           tombstones: s.tombstones, itemTombstones: s.itemTombstones };
}

function mergeStates(local, remote){
  const tombs = newestTombstones(local.tombstones, remote.tombstones);
  const itemTombs = newestTombstones(local.itemTombstones, remote.itemTombstones);

  const txById = {};
  local.tx.concat(remote.tx).forEach(t => { if (t && t.id && !tombs[t.id]) txById[t.id] = t; });

  const itemById = {};
  local.items.concat(remote.items).forEach(i => {
    if (!i || !i.id || itemTombs[i.id]) return;
    const cur = itemById[i.id];
    if (!cur || num(i.updatedAt) > num(cur.updatedAt)) itemById[i.id] = i;
  });

  const settings = num(remote.settings && remote.settings.updatedAt) > num(local.settings.updatedAt)
    ? Object.assign({}, local.settings, remote.settings)
    : Object.assign({}, local.settings);
  LOCAL_SETTINGS.forEach(k => settings[k] = local.settings[k]);

  return migrate({
    schema: SCHEMA, settings,
    items: Object.keys(itemById).map(k => itemById[k]),
    tx: Object.keys(txById).map(k => txById[k]),
    tombstones: tombs, itemTombstones: itemTombs
  });
}

function syncEnabled(){ return !!hostBridge && state.settings.sync !== false && !state.settings.demo; }
function setSyncState(s){ if (syncState !== s) { syncState = s; paintSync(); } }
function schedulePush(immediate){
  if (!syncEnabled() || !syncRef) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, immediate ? 0 : 600);
}
function pushNow(){
  if (!syncEnabled() || !syncRef) return;
  const payload = syncPayload(state);
  const sig = JSON.stringify(canon(payload));
  if (sig === lastPushedSig) return;
  setSyncState("saving");
  syncRef.set(Object.assign({ updatedAt: Date.now() }, payload)).then(() => {
    lastPushedSig = sig; syncRetry = 0; syncedAt = Date.now(); setSyncState("on");
  }).catch(err => {
    setSyncState("retry");
    const wait = Math.min(30000, 1000 * Math.pow(2, syncRetry++));
    clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, wait);
    console.warn("sync push failed", err);
  });
}
function onRemote(snap){
  if (!snap || !snap.exists) { schedulePush(true); return; }
  let doc;
  try { doc = snap.data(); } catch (e) { return; }
  if (!doc || !Array.isArray(doc.tx)) { schedulePush(true); return; }
  const incoming = migrate(doc);
  const merged = mergeStates(state, incoming);
  const before = JSON.stringify(canon(syncPayload(state)));
  state = merged;
  const after = JSON.stringify(canon(syncPayload(state)));
  saveLocal();
  syncedAt = Date.now();
  setSyncState("on");
  if (after !== before) { lastPushedSig = null; schedulePush(); }
  else lastPushedSig = after;
  render();
}
function stopSync(reason){
  if (syncUnsub) { try { syncUnsub(); } catch (e) {} }
  syncUnsub = null; syncRef = null; lastPushedSig = null;
  setSyncState(reason || (hostBridge ? "off" : "unsupported"));
}
function startSync(){
  if (!hostBridge) return setSyncState("unsupported");
  if (!syncEnabled()) return stopSync("off");
  setSyncState("connecting");
  hostBridge.use("db").then(db => {
    if (!db) return setSyncState("unsupported");
    if (!syncEnabled()) return;
    syncRef = db.doc(SYNC_DOC);
    syncUnsub = syncRef.onSnapshot(onRemote, err => {
      console.warn("sync stream failed", err); setSyncState("retry");
    });
  }).catch(() => setSyncState("unsupported"));
}
const SYNC_COPY = {
  unsupported:["", "Not available here"], off:["", "Off on this device"],
  connecting:["amber","Connecting…"], saving:["amber","Saving…"],
  retry:["red","Reconnecting…"], on:["green","On"]
};
function paintSync(){
  const el = document.querySelector("[data-sync-label]");
  if (!el) return;
  const [cls, label] = SYNC_COPY[syncState] || SYNC_COPY.off;
  el.textContent = label;
  const d = document.querySelector("[data-sync-dot]");
  if (d) d.className = "dot " + cls;
}

/* ============================================================
   Rendering
   ============================================================ */
const view = document.getElementById("view");
const themeQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

function resolvedTheme(){
  const t = state && state.settings.theme;
  if (t === "dark" || t === "light") return t;
  const host = document.documentElement.getAttribute("data-theme");
  if (host === "dark" || host === "light") return host;
  return themeQuery && themeQuery.matches ? "dark" : "light";
}
function applyTheme(){ document.documentElement.setAttribute("data-resolved-theme", resolvedTheme()); }

function render(){
  const d = derive();
  applyTheme();

  const p = payPeriod();
  const when = document.getElementById("tb-when");
  if (p.dated) when.textContent = "Next pay " + parseISO(p.nextPay).toLocaleDateString(undefined, { day:"numeric", month:"short" });
  else when.textContent = monthLabel(thisMonth());

  document.getElementById("tabs").innerHTML = TABS.map(t =>
    `<button data-tab="${t.toLowerCase()}" aria-selected="${ui.tab === t.toLowerCase()}">${t}</button>`).join("");

  let html = state.settings.demo ? demoBanner() : "";
  if (ui.tab === "goals") html += viewGoals(d);
  else if (ui.tab === "bills") html += viewBills(d);
  else if (ui.tab === "spending") html += viewSpending(d);
  else html += viewHome(d);
  view.innerHTML = html;
  paintSync();
}

function demoBanner(){
  return `<div id="demobar">
    <div class="t"><b>Example data</b>These figures are made up, so the screens show something.</div>
    <button data-act="startfresh">Start fresh</button>
  </div>`;
}

/* ---------- Home ---------- */
function viewHome(d){
  const p = payPeriod();
  const rows = billsAhead(d.bills);
  const risk = annotateRisk(rows, d.left);
  const over = d.left < -0.005;
  const f = fmtParts(d.left);
  const burn = burnRate();

  let line;
  if (over) line = "You are past your money by " + fmt(Math.abs(d.left)) + ".";
  else if (p.dated) line = p.daysLeft + " day" + (p.daysLeft === 1 ? "" : "s") + " to payday · " + fmt(p.daysLeft > 0 ? d.left / p.daysLeft : d.left) + " a day";
  else if (burn.perDay > 0.005 && d.left > 0) {
    const days = Math.floor(d.left / burn.perDay);
    if (days < 1) {
      line = "Less than a day left at " + fmt(burn.perDay) + " a day.";
    } else if (days > 120) {
      // Naming a date a year out reads as false precision on a fortnight of history.
      line = "About " + Math.round(days / 30) + " months at " + fmt(burn.perDay) + " a day";
    } else {
      const out = new Date(); out.setDate(out.getDate() + days);
      const opts = { day:"numeric", month:"long" };
      if (out.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
      line = days + " day" + (days === 1 ? "" : "s") + " at " + fmt(burn.perDay) + " a day · until "
           + out.toLocaleDateString(undefined, opts);
    }
  } else line = "Nothing recorded yet — record something and this fills in.";

  let html = `
  <section style="padding:20px 0 0">
    <div class="lab">Money left · ${esc(new Date().toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short" }))}</div>
    <div class="fig" data-hero data-act="count" style="cursor:pointer;font-size:66px;font-weight:500;letter-spacing:-.03em;line-height:1;margin-top:8px;color:${over ? "var(--neg)" : "var(--ink)"}">${esc(f.sign + f.symbol + f.main)}<span style="font-size:.4em;color:${over ? "var(--neg-2)" : "var(--ink-3)"}">${esc(f.cents)}</span></div>
    <div style="font-size:14px;color:var(--ink-2);margin-top:8px">${esc(line)}</div>`;

  /* Two different warnings. Being over is the loud one; a bill ahead that will
     not clear is the useful one, and it is worth saying while there is still
     time to do something about it. */
  if (over || risk) {
    const named = risk
      ? risk.row.item.name + " " + fmt(risk.row.item.amount, { whole:true }) + " on "
        + parseISO(risk.row.iso).toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short" })
        + " will not clear — short " + fmt(risk.gap) + "."
      : "Record money in, or take some back from a goal.";
    html += `<div class="note${over ? "" : " risk"}">
      <span class="bang">!</span>
      <span style="flex:1;min-width:0">
        <b>${over
          ? "Over your money by " + esc(fmt(Math.abs(d.left), { bare:true }))
          : "A bill ahead will not clear"}</b>
        <span>${esc(named)}</span>
      </span></div>`;
  }
  html += `</section>`;

  /* Coming up */
  html += `<div style="margin-top:16px">
    <div class="sec"><span class="lab">Coming up</span>${rows.length > 3 ? `<button class="more" data-tab-jump="bills">See all ${rows.length}</button>` : ""}</div>`;
  if (!rows.length) html += `<div class="empty">No bills listed yet. Add one on the Bills tab and it will show up here.</div>`;
  else html += rows.slice(0, 3).map(billRow).join("");
  html += `</div>`;

  /* Goals */
  html += `<div style="margin-top:14px">
    <div class="sec"><span class="lab">Goals</span><button class="more" data-tab-jump="goals">${d.goals.length ? "Cut money to one" : "Add one"}</button></div>`;
  if (!d.goals.length) html += `<div class="empty">Nothing set aside. A goal holds nothing until you cut money to it.</div>`;
  else html += d.goals.map(g => {
    const saved = d.held[g.id] || 0;
    return `<button class="lead" data-open-goal="${esc(g.id)}">
      <span class="when" style="width:26px">${esc(g.code)}</span>
      <span class="what">${esc(g.name)}</span>
      <span class="dots"></span>
      <span class="amt">${esc(fmt(goalFigure(g, saved)))}</span>
    </button>`;
  }).join("");
  html += `</div>`;

  /* Latest */
  const latest = state.tx.filter(t => t.kind === "expense").sort(byDateDesc);
  html += `<div style="margin-top:14px">
    <div class="sec"><span class="lab">Latest</span>${latest.length ? `<button class="more" data-tab-jump="spending">See all ${latest.length}</button>` : ""}</div>`;
  if (!latest.length) html += `<div class="empty">Nothing spent yet.</div>`;
  else html += latest.slice(0, 2).map(t => `
    <div class="lead">
      <span class="when" style="width:46px">${esc(relDay(t.date))}</span>
      <span class="what">${esc(txName(t))}</span>
      <span class="dots"></span>
      <span class="amt">${esc(fmt(t.amount))}</span>
    </div>`).join("");
  html += `</div>`;

  /* The bar: how the period's money has gone */
  const income = incomeSince(p.from);
  if (income > 0.005) {
    const spent = spentSince(p.from);
    const cutPct = clamp(d.cuts / income * 100, 0, 100);
    const spentPct = clamp(spent / income * 100, 0, 100 - cutPct);
    html += `
    <div style="padding:16px 0 20px;margin-top:14px;border-top:1px solid var(--ink)">
      <div class="lab" style="font-size:11px;letter-spacing:.26em">${p.dated
        ? "Of your " + esc(fmt(income, { whole:true })) + " pay"
        : "Of the " + esc(fmt(income, { whole:true })) + " that came in"}</div>
      <div style="display:flex;align-items:center;gap:16px;margin-top:12px">
        <span class="gauge tall" style="flex:1">
          <i class="hatch-cut" style="width:${cutPct}%"></i>
          <i class="hatch-ink" style="width:${spentPct}%"></i>
        </span>
        <span class="fig" style="font-size:22px;color:var(--ink-2)">${Math.round(spent / income * 100)}%</span>
      </div>
      <div style="display:flex;gap:14px;margin-top:10px;flex-wrap:wrap" class="lab-s">
        <span><i style="display:inline-block;width:7px;height:7px;background:var(--cut);margin-right:5px"></i>Cut ${esc(fmt(d.cuts, { whole:true }))}</span>
        <span><i style="display:inline-block;width:7px;height:7px;background:var(--ink);margin-right:5px"></i>Spent ${esc(fmt(spent, { whole:true }))}</span>
        <span><i style="display:inline-block;width:7px;height:7px;background:var(--quiet-line);margin-right:5px"></i>Left ${esc(fmt(d.left, { whole:true }))}</span>
      </div>
    </div>`;
  } else {
    html += `<div style="height:18px"></div>`;
  }
  return html;
}

/** What a record is called in a list: what you wrote on it if you wrote
    anything, else the label it was filed under. Three Takeaways in a row all
    reading "Takeaway" is a list you cannot audit. */
function txName(t){
  return (t.note && t.note.trim()) || t.label || (t.kind === "income" ? "Money in" : "Spending");
}

function byDateDesc(a, b){
  if (a.date === b.date) return a.id < b.id ? 1 : -1;
  return a.date < b.date ? 1 : -1;
}

function billRow(r){
  const when = parseISO(r.iso).toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short" });
  return `<button class="row" data-pay-bill="${esc(r.item.id)}|${esc(r.period)}">
    <span class="code">${esc(r.item.code)}</span>
    <span class="row-main">
      <span class="row-name">${esc(r.item.name)}</span>
      <span class="row-sub">${esc(when)}</span>
    </span>
    <span class="tag ${r.cls || ""}">${esc(r.tag)}</span>
    <span class="row-amt">${esc(fmt(r.item.amount, { whole:true }))}</span>
  </button>`;
}

/* ---------- Goals ---------- */
function viewGoals(d){
  let html = `<div style="padding:20px 0 20px">
    <div class="fig" style="font-size:26px;font-weight:500;letter-spacing:-.02em">Goals</div>
    <div style="font-size:14px;color:var(--ink-2);margin-top:4px">A goal holds nothing until you cut money to it.</div>`;

  if (!d.goals.length) {
    html += `<div class="empty" style="border:0">Nothing here yet.</div>`;
  }
  html += d.goals.map(g => {
    const saved = d.held[g.id] || 0;
    const target = num(g.target);
    const debt = g.kind === "debt";
    const pct = target > 0 ? clamp(saved / target * 100, 0, 100) : 0;
    const pace = goalPace(g, saved);

    /* The tag says where you stand; the line under the gauge says what it
       asks of you. Saying the monthly figure in both was just an echo. */
    let sub, tag = "", cls = "", pacing = "";
    if (debt) {
      sub = target > 0 ? "left of " + fmt(target) + (g.targetDate ? " · clear by " + monthLabel(g.targetDate) : "") : "owed";
      if (saved >= target - 0.005 && target > 0) { tag = "Cleared"; cls = "ok"; }
      pacing = fmt(saved) + " repaid";
    } else if (target > 0) {
      sub = "of " + fmt(target, { whole:true }) + (g.targetDate ? " by " + monthLabel(g.targetDate) : "");
      if (pace && pace.done) { tag = "Reached"; cls = "ok"; }
      else if (pace && pace.overdue) { tag = "Past the date"; cls = "bad"; }
      else if (pace) tag = pace.monthsLeft + " month" + (pace.monthsLeft === 1 ? "" : "s") + " left";
      pacing = pace && !pace.done ? fmt(pace.perMonth) + " a month" : fmt(saved) + " saved";
    } else {
      sub = "no target set";
      pacing = fmt(saved) + " saved";
    }

    return `
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--ink)">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
        <span style="font-size:17px;font-weight:600;letter-spacing:-.015em">${esc(g.name)}</span>
        ${tag ? `<span class="tag ${cls}">${esc(tag)}</span>` : ""}
      </div>
      <div class="fig" style="font-size:38px;font-weight:500;letter-spacing:-.025em;line-height:1;margin-top:10px">${esc(fmt(goalFigure(g, saved)))}</div>
      <div style="font-size:13.5px;color:var(--ink-2);margin-top:5px">${esc(sub)}</div>
      ${target > 0 ? `<div class="gauge" style="margin-top:14px"><i class="hatch-ink" style="width:${pct}%"></i></div>
      <div class="lab-s" style="display:flex;justify-content:space-between;gap:12px;margin-top:9px;letter-spacing:.12em">
        <span>${Math.round(pct)}% there</span>
        <span>${esc(pacing)}</span>
      </div>` : ""}
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button class="pill sm" data-cut="${esc(g.id)}">${debt ? "Pay some off" : "Cut money to it"}</button>
        <button class="pill sm ghost" data-take="${esc(g.id)}">Take money back…</button>
        <button class="pill sm ghost" data-edit-item="${esc(g.id)}">Edit</button>
      </div>
    </div>`;
  }).join("");

  html += `<button class="pill ghost" style="margin-top:22px;width:100%" data-new-item="goal">New goal</button>
    </div>`;
  return html;
}

/* ---------- Bills ---------- */
function viewBills(d){
  const rows = billsAhead(d.bills);
  annotateRisk(rows, d.left);
  const due = round2(rows.filter(r => !r.paid).reduce((s, r) => s + num(r.item.amount), 0));

  let html = `<div style="padding:20px 0 20px">
    <div class="fig" style="font-size:26px;font-weight:500;letter-spacing:-.02em">Bills</div>
    <div style="font-size:14px;color:var(--ink-2);margin-top:4px">Listed, never reserved. Tap one when it goes out.</div>
    <div style="margin-top:18px">`;

  if (!rows.length) html += `<div class="empty">No bills with dates yet.</div>`;
  else html += rows.map(billRow).join("");

  html += `</div>
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--ink)">
      <span class="lab">Still to come out</span>
      <span class="fig" style="font-size:24px">${esc(fmt(due))}</span>
    </div>
    <button class="pill ghost" style="margin-top:20px;width:100%" data-new-item="bill">New bill</button>
    ${d.bills.length ? `<div class="lab-s" style="margin-top:16px;letter-spacing:.1em">Edit a bill</div>
      <div>${d.bills.map(b => `<button class="lead" data-edit-item="${esc(b.id)}">
        <span class="when" style="width:26px">${esc(b.code)}</span>
        <span class="what">${esc(b.name)}</span><span class="dots"></span>
        <span class="amt">${esc(fmt(b.amount))}</span></button>`).join("")}</div>` : ""}
    </div>`;
  return html;
}

/* ---------- Spending ---------- */
function viewSpending(d){
  const mk = thisMonth();
  const spent = spentIn(mk);
  const out = state.tx.filter(t => t.kind === "expense");
  /* Money in belongs in the list too: it is the only place an entry can be
     looked at, and a mistyped tip has to be undoable somewhere. */
  const all = state.tx.filter(t => t.kind === "expense" || t.kind === "income").sort(byDateDesc);
  const shown = ui.seeAll ? all : all.slice(0, 40);
  const burn = burnRate();

  let html = `<div style="padding:20px 0 20px">
    <div class="lab">Spent in ${esc(monthLabel(mk, true).split(" ")[0])}</div>
    <div class="fig" style="font-size:52px;font-weight:500;letter-spacing:-.03em;line-height:1;margin-top:8px">${esc(fmt(spent))}</div>
    <div style="font-size:14px;color:var(--ink-2);margin-top:8px">${out.length} record${out.length === 1 ? "" : "s"} · ${esc(fmt(burn.perDay))} a day so far</div>`;

  /* Where it goes, by label */
  const groups = {};
  state.tx.forEach(t => {
    if (t.kind !== "expense" || monthOfISO(t.date) !== mk) return;
    const l = (t.label || t.note || "Unlabelled").trim() || "Unlabelled";
    const k = l.toLowerCase();
    if (!groups[k]) groups[k] = { label:l, total:0, count:0 };
    groups[k].total = round2(groups[k].total + num(t.amount));
    groups[k].count++;
  });
  const ranked = Object.keys(groups).map(k => groups[k]).sort((a, b) => b.total - a.total);
  if (ranked.length) {
    html += `<div style="margin-top:18px"><div class="sec"><span class="lab">Where it goes</span></div>`;
    html += ranked.map(g => {
      const pct = spent > 0 ? clamp(g.total / spent * 100, 0, 100) : 0;
      return `<div style="padding:11px 0;border-bottom:1px dashed var(--dash)">
        <div style="display:flex;align-items:baseline;gap:10px">
          <span style="font-size:15px;font-weight:600;letter-spacing:-.01em">${esc(g.label)}</span>
          <span class="dots" style="flex:1;border-bottom:1px dotted var(--dash);transform:translateY(-4px)"></span>
          <span class="lab-s" style="letter-spacing:.1em">${Math.round(pct)}%</span>
          <span class="fig" style="font-size:17px">${esc(fmt(g.total))}</span>
        </div>
        <div class="gauge" style="height:8px;margin-top:9px"><i class="hatch-ink" style="width:${pct}%"></i></div>
      </div>`;
    }).join("");
    html += `</div>`;
  }

  /* What came in, and from where */
  const inGroups = incomeBy(mk);
  const inRanked = Object.keys(inGroups).map(k => inGroups[k]).sort((a, b) => b.total - a.total);
  const inTotal = round2(inRanked.reduce((a, g) => a + g.total, 0));
  if (inRanked.length) {
    html += `<div style="margin-top:18px"><div class="sec">
      <span class="lab">Money in</span>
      <span class="fig" style="font-size:17px">${esc(fmt(inTotal))}</span></div>`;
    html += inRanked.map(g => `
      <div class="lead" style="border-bottom:1px dashed var(--dash)">
        <span class="what">${esc(g.label)}</span>
        <span class="dots"></span>
        <span class="lab-s" style="letter-spacing:.1em">${g.count}&times;</span>
        <span class="amt pos" style="color:var(--pos)">${esc(fmt(g.total))}</span>
      </div>`).join("");
    html += `</div>`;
  }

  html += `<div style="margin-top:18px">
    <div class="sec"><span class="lab">Newest first</span>${!ui.seeAll && all.length > 40 ? `<button class="more" data-act="seeall">Show all ${all.length}</button>` : ""}</div>`;
  if (!shown.length) html += `<div class="empty">Nothing recorded yet.</div>`;
  else html += shown.map(t => `
    <div class="lead" style="border-bottom:1px dashed var(--dash)">
      <span class="when" style="width:46px">${esc(relDay(t.date))}</span>
      <span class="what">${esc(txName(t))}${t.auto ? " ·" : ""}</span>
      <span class="dots"></span>
      <button class="undo" data-del-tx="${esc(t.id)}">Undo</button>
      <span class="amt"${t.kind === "income" ? ' style="color:var(--pos)"' : ""}>${t.kind === "income" ? "+" : ""}${esc(fmt(t.amount))}</span>
    </div>`).join("");
  html += `</div></div>`;
  return html;
}

/* ============================================================
   Sheets
   ============================================================ */
function openSheet(title, body){
  closeSheet(true);
  const app = document.getElementById("app");
  const backdrop = document.createElement("div");
  backdrop.id = "backdrop";
  backdrop.addEventListener("click", () => closeSheet());

  const sheet = document.createElement("div");
  sheet.id = "sheet";
  sheet.setAttribute("role", "dialog");
  sheet.setAttribute("aria-modal", "true");
  sheet.innerHTML = `
    <div class="sheet-head">
      <h3>${esc(title)}</h3>
      <button class="close" data-act="closesheet">Close</button>
    </div>
    <div class="sheet-body">${body}</div>`;
  app.appendChild(backdrop);
  app.appendChild(sheet);
  const first = sheet.querySelector("input,select,textarea");
  if (first) setTimeout(() => first.focus(), 60);
}
function closeSheet(silent){
  const b = document.getElementById("backdrop"), s = document.getElementById("sheet");
  if (b) b.remove();
  if (s) s.remove();
  if (!silent) { ui.sheet = null; ui.pad = ""; ui.label = ""; ui.other = ""; ui.borrow = ""; ui.src = ""; ui.date = todayISO(); ui.pick = false; }
}
function sheetEl(){ return document.getElementById("sheet"); }
function val(sel){ const el = sheetEl() && sheetEl().querySelector(sel); return el ? el.value : ""; }

function toast(msg){
  const old = document.getElementById("toast");
  if (old) old.remove();
  const el = document.createElement("div");
  el.id = "toast"; el.textContent = msg;
  document.getElementById("app").appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2600);
}
function confirmSheet(title, message, label, onYes){
  openSheet(title, `
    <div style="font-size:14.5px;line-height:1.55;color:var(--ink-2);padding:4px 0 16px">${esc(message)}</div>
    <button class="pill" style="width:100%" data-confirm-yes>${esc(label)}</button>
    <button class="pill ghost" style="width:100%;margin-top:8px" data-act="closesheet">Cancel</button>`);
  sheetEl().querySelector("[data-confirm-yes]").addEventListener("click", () => { closeSheet(); onYes(); });
}

/* ---- the keypad, shared by every amount sheet ---- */
function keypad(){
  const keys = ["1","2","3","4","5","6","7","8","9",".","0","⌫"];
  return `<div class="keys">${keys.map(k => `<button data-key="${esc(k)}">${esc(k)}</button>`).join("")}</div>`;
}
function padPress(k){
  let cur = ui.pad || "";
  if (k === "⌫") cur = cur.slice(0, -1);
  else if (k === ".") cur = cur.indexOf(".") >= 0 ? cur : (cur || "0") + ".";
  else if (/\.\d\d$/.test(cur)) { /* two decimals is the end of it */ }
  else if (cur.replace(".", "").length >= 9) { /* long enough */ }
  else cur = cur === "0" ? k : cur + k;
  ui.pad = cur;
  refreshSheet();
}
function padValue(){ return parseAmount(ui.pad); }
/** The day being recorded — never the future, and never blank. */
function recordDate(){
  const d = ui.date || todayISO();
  return /^\d{4}-\d{2}-\d{2}$/.test(d) && d <= todayISO() ? d : todayISO();
}
function amountBlock(){
  const c = currencyMeta();
  return `<div class="amount">
    <span class="cur">${esc(c.symbol)}</span>
    <span class="val" data-pad-display>${esc(ui.pad || "0")}</span>
  </div>`;
}
/** Re-render the open sheet in place, keeping the keypad responsive without a
    full app render behind it. */
function refreshSheet(){
  if (!ui.sheet) return;
  const map = { spend:sheetSpend, income:sheetIncome, cut:sheetCut, take:sheetTake, count:sheetCount };
  const fn = map[ui.sheet];
  if (!fn) return;
  /* Re-rendering under a typing finger would drop the caret and close the
     keyboard, so put both back exactly where they were. */
  const live = sheetEl() && sheetEl().querySelector("input:focus, textarea:focus");
  const id = live && live.id, at = live ? live.selectionStart : null;
  fn(true);
  if (!id) return;
  const back = sheetEl() && sheetEl().querySelector("#" + id);
  if (!back) return;
  back.focus();
  try { back.setSelectionRange(at, at); } catch (e) {}
}

/* Money does not always land on the day you record it: tips come the next
   morning, a receipt surfaces in a pocket a week later. Today and Yesterday
   cover almost every case in one tap; the third chip opens a real picker and
   then wears the date it chose. */
function dateRow(){
  const today = todayISO(), yest = isoBack(1), cur = recordDate();
  return `
    <div class="lab" style="padding:14px 0 9px;letter-spacing:.2em">When</div>
    <div class="chips">
      <button data-when="${today}" aria-pressed="${!ui.pick && cur === today}">Today</button>
      <button data-when="${yest}" aria-pressed="${!ui.pick && cur === yest}">Yesterday</button>
      <button data-when="pick" aria-pressed="${!!ui.pick}">${esc(ui.pick && cur !== today ? relDay(cur) : "Pick a date")}</button>
    </div>
    ${ui.pick ? `<div class="field"><input class="input" type="date" id="f-when" value="${esc(cur)}" max="${today}"></div>` : ""}`;
}

/* ---- record spending ---- */
function sheetSpend(re){
  ui.sheet = "spend";
  const amt = padValue();
  const labels = state.settings.labels.concat([OTHER]);
  const named = ui.label === OTHER ? (ui.other || "").trim() : ui.label;
  const can = amt > 0 && !!named;
  const body = `
    ${amountBlock()}
    <div class="lab" style="padding:14px 0 9px;letter-spacing:.2em">What was it for</div>
    <div class="chips">${labels.map(l =>
      `<button data-chip="${esc(l)}" aria-pressed="${ui.label === l}">${esc(l)}</button>`).join("")}</div>
    ${ui.label === OTHER ? `<div class="field"><input class="input" id="f-other" value="${esc(ui.other)}" placeholder="Type what it was for"></div>` : ""}
    ${dateRow()}
    ${keypad()}
    <button class="pill ${can ? "" : "dead"}" style="width:100%;margin-top:14px" data-do="spend">${
      !amt ? "Enter an amount" : (!named ? "Pick what it was for" : "Record " + esc(fmt(amt)) + " · " + esc(named))}</button>`;
  if (re) { sheetEl().querySelector(".sheet-body").innerHTML = body; }
  else openSheet("Spent", body);
}
function doSpend(){
  const amt = padValue();

/* ---- money in ---- */
/**
 * Money in, and — if any of it is borrowed — which debt it adds to. Borrowing
 * is two facts at once: you have the money, and you owe it. Recording only the
 * first is what makes a balance lie, so the sheet takes both in one go and
 * raises that goal's target by the same amount.
 */
function sheetIncome(re){
  ui.sheet = "income";
  const amt = padValue();
  const d = derive();
  const debts = d.goals.filter(g => g.kind === "debt");
  const from = debts.find(g => g.id === ui.borrow) || null;

  const who = ui.src === WHO;
  const named = who ? (ui.other || "").trim() : ui.src;

  let say;
  if (from) {
    say = "Lands in your balance, and what you owe " + from.name + " goes up to "
        + fmt(round2(num(from.target) + amt)) + ".";
  } else if (named) {
    const sofar = incomeBy(thisMonth())[named.toLowerCase()];
    say = sofar
      ? named + " so far this month: " + fmt(sofar.total) + " over " + sofar.count + " time" + (sofar.count === 1 ? "" : "s") + "."
      : "Counted as " + named + ", and totalled on its own.";
  } else if (who) {
    say = "Type who it came from.";
  } else if (debts.length) {
    say = "It all lands in your balance. Say where it came from and it gets totalled separately.";
  } else {
    say = "It all lands in your balance. Borrowing it? Make a goal under Goals → "
        + "Money I owe and it will be offered here.";
  }

  const can = amt > 0 && (!!from || !!named);
  const body = `
    ${amountBlock()}
    <div class="lab" style="padding:14px 0 9px;letter-spacing:.2em">Where it came from</div>
    <div class="chips">
      ${state.settings.income.map(s =>
        `<button data-src="${esc(s)}" aria-pressed="${!from && ui.src === s}">${esc(s)}</button>`).join("")}
      <button data-src="${WHO}" aria-pressed="${who}">From someone</button>
      ${debts.map(g => `<button data-borrow="${esc(g.id)}" aria-pressed="${from && from.id === g.id}">Borrowed · ${esc(g.name)}</button>`).join("")}
    </div>
    ${who ? `<div class="field"><input class="input" id="f-other" value="${esc(ui.other)}" placeholder="Who gave it to you?"></div>` : ""}
    ${dateRow()}
    <div class="say">${esc(say)}</div>
    ${keypad()}
    <button class="pill ${can ? "" : "dead"}" style="width:100%;margin-top:14px" data-do="income">${
      amt <= 0 ? "Enter an amount"
      : from ? "Borrow " + esc(fmt(amt)) + " from " + esc(from.name)
      : named ? "Add " + esc(fmt(amt)) + " · " + esc(named)
      : who ? "Say who it was from"
      : "Pick where it came from"}</button>`;
  if (re) sheetEl().querySelector(".sheet-body").innerHTML = body;
  else openSheet("Money in", body);
}
function doIncome(){
  const amt = padValue();
  if (amt <= 0) return toast("Enter an amount above zero");
  const from = state.items.find(i => i.id === ui.borrow && i.type === "goal" && i.kind === "debt");
  const named = ui.src === WHO ? (val("#f-other") || ui.other || "").trim() : ui.src;
  if (!from && !named) return toast(ui.src === WHO ? "Say who it was from" : "Pick where it came from");
  addTx({ kind:"income", amount:amt, date:recordDate(),
          label: from ? "" : named,
          note: from ? "Borrowed from " + from.name : "" });
  if (from) {
    from.target = round2(num(from.target) + amt);
    from.updatedAt = Date.now();
    save();
  }
  closeSheet(); render();
  toast(from ? "+" + fmt(amt) + " · you owe " + fmt(goalFigure(from, derive().held[from.id] || 0))
             : "+" + fmt(amt) + (named ? " · " + named : ""));
}

/* ---- cut money to a goal ---- */
function sheetCut(re){
  ui.sheet = "cut";
  const d = derive();
  const g = d.goals[ui.goalIx];
  if (!g) return closeSheet();
  const saved = d.held[g.id] || 0;
  const amt = padValue();
  const remaining = round2(Math.max(0, num(g.target) - saved));
  const pace = goalPace(g, saved);
  const ok = amt > 0 && amt <= d.left + 0.005;

  const sugg = [];
  if (g.kind === "debt" && remaining > 0) sugg.push(["Clear it · " + fmt(remaining), remaining]);
  else if (pace && pace.perMonth > 0) sugg.push(["Monthly · " + fmt(pace.perMonth, { whole:true }), Math.round(pace.perMonth)]);
  sugg.push(["Round hundred · " + fmt(100, { whole:true }), 100]);

  const body = `
    ${amountBlock()}
    <div class="chips" style="padding:12px 0 0">${sugg.map(([l, v]) =>
      `<button data-sugg="${v}">${esc(l)}</button>`).join("")}</div>
    ${keypad()}
    <div class="say ${amt > d.left ? "warn" : ""}">${esc(
      d.left <= 0 ? "You have nothing spare — your balance is " + fmt(Math.abs(d.left)) + " under."
      : amt > d.left ? "That is more than your " + fmt(d.left) + " balance."
      : "Comes straight out of your " + fmt(d.left) + " balance.")}</div>
    <button class="pill ${ok ? "" : "dead"}" style="width:100%;margin-top:12px" data-do="cut">${
      amt > 0 ? "Cut " + esc(fmt(amt)) + " now" : "Enter an amount"}</button>`;
  if (re) sheetEl().querySelector(".sheet-body").innerHTML = body;
  else openSheet((g.kind === "debt" ? "Pay off " : "Cut to ") + g.name, body);
}
function doCut(){
  const d = derive();
  const g = d.goals[ui.goalIx];
  const amt = padValue();
  if (!g) return closeSheet();
  if (amt <= 0) return toast("Enter an amount above zero");

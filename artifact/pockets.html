function doSaveItem(id, type){
  const name = (val("#f-name") || "").trim();
  if (!name) return toast("Give it a name");
  const patch = { name, type, updatedAt: Date.now() };

  if (type === "goal") {
    patch.kind = val("#f-kind") === "debt" ? "debt" : "save";
    patch.target = parseAmount(val("#f-target"));
    patch.targetDate = /^\d{4}-\d{2}$/.test(val("#f-targetdate")) ? val("#f-targetdate") : null;
  } else if (type === "bill") {
    patch.amount = parseAmount(val("#f-amount"));
    if (patch.amount <= 0) return toast("Give it an amount");
    if (val("#f-shape") === "cycle") {
      patch.cycleDays = clamp(Math.round(parseAmount(val("#f-cycledays"))), 1, 365);
      patch.cycleStart = /^\d{4}-\d{2}-\d{2}$/.test(val("#f-cyclestart")) ? val("#f-cyclestart") : todayISO();
      patch.dueDay = null;
      if (!patch.cycleDays) return toast("How many days between them?");
    } else {
      patch.dueDay = clamp(Math.round(parseAmount(val("#f-dueday"))), 1, 31);
      patch.cycleDays = null; patch.cycleStart = null;
      if (!patch.dueDay) return toast("Which day of the month?");
    }
  } else {
    patch.amount = parseAmount(val("#f-amount"));
    patch.days = (val("#f-days") || "").split(",").map(Number).filter(n => n >= 0 && n <= 6);
    patch.from = /^\d{4}-\d{2}-\d{2}$/.test(val("#f-from")) ? val("#f-from") : todayISO();
    if (patch.amount <= 0) return toast("Give it an amount");
    if (!patch.days.length) return toast("Pick at least one day");
  }

  if (id) {
    const it = state.items.find(i => i.id === id);
    Object.assign(it, patch);
    it.code = codeFor(it.name, state.items);
  } else {
    const it = mkItem(Object.assign({ order: state.items.length }, patch));
    it.code = codeFor(it.name, state.items);
    state.items.push(it);
  }
  save(); closeSheet();
  if (type === "repeat") { if (runRepeats()) save(); }
  render();
  toast(name + " saved");
}

/**
 * Deleting a goal has to answer one question: is the money in it still yours?
 *
 * For a savings goal it is — it goes back to your balance. For a debt goal it
 * is not: what it holds is what you already handed over, so giving it back
 * would invent money you no longer have. Those repayments become records of
 * money spent instead, which is what they were, and your balance does not move.
 */
function deleteItem(id){
  const it = state.items.find(i => i.id === id);
  if (!it) return;
  const d = derive();
  const saved = round2(d.held[id] || 0);
  const repaid = it.type === "goal" && it.kind === "debt" && saved > 0.005;
  const kindWord = it.type === "bill" ? "bill" : it.type === "repeat" ? "repeating charge" : "goal";

  confirmSheet("Delete " + it.name + "?",
    repaid
      ? "You have paid " + fmt(saved) + " of this. That money is gone, so it stays gone — it goes into your records as money spent, and your balance does not change."
      : saved > 0.005
        ? "It holds " + fmt(saved) + ". That goes back into your balance. Spending you recorded stays."
        : "Spending you recorded stays. This only removes the " + kindWord + ".",
    "Delete", () => {
      if (repaid) {
        addTx({ kind:"expense", amount:saved, label:it.name, date:todayISO(), note:"Paid " + it.name });
        addTx({ kind:"allocate", amount:-saved, itemId:id, date:todayISO(), note:"Settled " + it.name });
      } else if (saved > 0.005) {
        addTx({ kind:"allocate", amount:-saved, itemId:id, date:todayISO(), note:"Returned from " + it.name });
      }
      state.items = state.items.filter(i => i.id !== id);
      state.itemTombstones[id] = Date.now();
      save(); render(); toast(it.name + " deleted");
    });
}

/* ---- count what you actually have ----
   The app is only ever as right as what you told it. This asks what is really
   in your hand and your accounts, shows the gap, and writes the gap off in one
   tap — so a missed coffee three weeks ago stops quietly poisoning the figure
   you make decisions on. */
function sheetCount(re){
  ui.sheet = "count";
  const d = derive();
  const counted = padValue();
  const typed = (ui.pad || "").length > 0;
  const diff = round2(counted - d.onHand);
  const off = Math.abs(diff) > 0.005;
  const split = d.saved > 0.005;

  let say;
  if (!typed) {
    say = "Add up your cash and your bank" + (split ? ", goal money included, " : " ") + "and type the lot.";
  } else if (!off) {
    say = "Spot on. Nothing to change.";
  } else if (diff < 0) {
    say = "You have " + fmt(Math.abs(diff)) + " less than the app thought — something went out that never got recorded.";
  } else {
    say = "You have " + fmt(diff) + " more than the app thought — something came in that never got recorded.";
  }

  /* What you should be holding is not the same as what you may spend: a savings
     goal takes money out of the headline without taking it out of the bank. Show
     the sum as it is built, or the hand count reads as a shortfall every time. */
  const target = split ? `
    <div class="setrow" style="padding-top:0">
      <span style="flex:1"><b>Money left</b><span class="sub">Yours to spend</span></span>
      <span class="fig">${esc(fmt(d.left))}</span>
    </div>
    <div class="setrow">
      <span style="flex:1"><b>Held in goals</b><span class="sub">Spoken for, but still in your account</span></span>
      <span class="fig">${esc(fmt(d.saved))}</span>
    </div>
    <div class="setrow" style="border-top:1px solid var(--ink);border-bottom:0">
      <span style="flex:1"><b>So you should be holding</b></span>
      <span class="fig" style="font-size:22px">${esc(fmt(d.onHand))}</span>
    </div>` : `
    <div class="setrow" style="padding-top:0">
      <span style="flex:1"><b>The app says</b><span class="sub">Money left, right now</span></span>
      <span class="fig" style="font-size:22px">${esc(fmt(d.onHand))}</span>
    </div>`;

  const body = `
    ${target}
    <div class="lab" style="padding:16px 0 9px;letter-spacing:.2em">What you actually have</div>
    ${amountBlock()}
    <div class="say ${typed && off ? "warn" : ""}">${esc(say)}</div>
    ${keypad()}
    <button class="pill ${typed && off ? "" : "dead"}" style="width:100%;margin-top:14px" data-do="count">${
      !typed ? "Type what you counted"
      : !off ? "Nothing to record"
      : "Record the " + esc(fmt(Math.abs(diff))) + " difference"}</button>`;
  if (re) sheetEl().querySelector(".sheet-body").innerHTML = body;
  else openSheet("Count my money", body);
}
function doCount(){
  const d = derive();
  const counted = padValue();
  if (!(ui.pad || "").length) return toast("Type what you counted");
  const diff = round2(counted - d.onHand);
  if (Math.abs(diff) <= 0.005) { closeSheet(); return toast("Already matches"); }
  addTx(diff < 0
    ? { kind:"expense", amount:Math.abs(diff), label:"Other", note:"Not recorded", date:todayISO() }
    : { kind:"income", amount:diff, date:todayISO(), note:"Found when counting" });
  closeSheet(); render();
  toast(d.saved > 0.005
    ? "Now adds up to " + fmt(counted) + ", " + fmt(round2(counted - d.saved)) + " of it spendable"
    : "Now says " + fmt(counted));
}

function doSaveSettings(){
  const s = state.settings;
  s.name = (val("#f-yourname") || "").trim().slice(0, 40);
  s.payday = /^\d{4}-\d{2}-\d{2}$/.test(val("#f-payday")) ? val("#f-payday") : null;
  s.payEvery = clamp(Math.round(parseAmount(val("#f-payevery"))) || 30, 1, 365);
  s.currency = CURRENCIES.some(c => c.code === val("#f-currency")) ? val("#f-currency") : "EUR";
  s.theme = ["auto","light","dark"].indexOf(val("#f-themeval")) >= 0 ? val("#f-themeval") : "auto";
  const seen = {};
  s.labels = (val("#f-labels") || "").split(",").map(x => x.trim())
    .filter(x => x && x !== OTHER && !seen[x.toLowerCase()] && (seen[x.toLowerCase()] = true)).slice(0, 12);
  if (!s.labels.length) s.labels = DEFAULT_LABELS.slice();
  const seenIn = {};
  s.income = (val("#f-income") || "").split(",").map(x => x.trim())
    .filter(x => x && !seenIn[x.toLowerCase()] && (seenIn[x.toLowerCase()] = true)).slice(0, 8);
  if (!s.income.length) s.income = DEFAULT_INCOME.slice();
  s.updatedAt = Date.now();
  save(); closeSheet(); render(); toast("Saved");
}
function doToggleSync(){
  state.settings.sync = state.settings.sync === false;
  saveLocal();
  if (state.settings.sync) startSync(); else stopSync("off");
  closeSheet(); sheetSettings();
}

/* ---- backup / restore ----
   Opened as an ordinary page, a link with `download` saves the file. Inside
   the Artifact viewer downloads are blocked unless the runtime allows one, so
   the text is shown with a copy button instead — pasting it back restores
   exactly the same budget. */
let downloadsPromise = null;
function getDownloads(){
  if (!hostBridge) return Promise.resolve(null);
  if (!downloadsPromise) downloadsPromise = hostBridge.use("downloads").catch(() => null);
  return downloadsPromise;
}
function exportData(){
  const json = JSON.stringify(state, null, 2);
  const name = "pockets-backup-" + todayISO() + ".json";
  getDownloads().then(dl => {
    if (dl && dl.save) {
      dl.save({ filename:name, data:json })
        .then(() => toast("Backup saved"))
        .catch(() => sheetBackupText(json));
      return;
    }
    if (hostBridge) return sheetBackupText(json);
    const blob = new Blob([json], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Backup saved");
  });
}
function sheetBackupText(json){
  openSheet("Your backup", `
    <div class="say" style="padding-top:0">Copy this and keep it somewhere safe. Pasting it into Restore brings the whole budget back.</div>
    <textarea class="input" id="f-backup" rows="9" readonly>${esc(json)}</textarea>
    <button class="pill" style="width:100%;margin-top:12px" data-do="copybackup">Copy to clipboard</button>`);
}
function doCopyBackup(){
  const el = sheetEl().querySelector("#f-backup");
  el.select();
  const done = () => toast("Copied");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(el.value).then(done).catch(() => { try { document.execCommand("copy"); done(); } catch (e) { toast("Select it and copy"); } });
  } else { try { document.execCommand("copy"); done(); } catch (e) { toast("Select it and copy"); } }
}
function sheetRestore(){
  openSheet("Restore", `
    <div class="say" style="padding-top:0">This replaces everything on this device${syncEnabled() ? " and on every device you are synced with" : ""}.</div>
    <div class="field"><label class="lab">From a file</label>
      <input class="input" type="file" id="f-file" accept="application/json,.json"></div>
    <div class="field"><label class="lab">Or paste the text</label>
      <textarea class="input" id="f-paste" rows="6" placeholder="Paste a backup here"></textarea></div>
    <button class="pill" style="width:100%;margin-top:12px" data-do="paste-restore">Restore from the text</button>`);
  sheetEl().querySelector("#f-file").addEventListener("change", handleImportFile);
}
function applyRestore(parsed){
  const next = migrate(parsed);
  if (!next.tx.length && !next.items.length) return toast("That backup looks empty");
  const now = Date.now();
  state.tx.forEach(t => { if (!next.tx.some(n => n.id === t.id)) next.tombstones[t.id] = now; });
  state.items.forEach(i => { if (!next.items.some(n => n.id === i.id)) next.itemTombstones[i.id] = now; });
  next.settings.theme = state.settings.theme;
  next.settings.sync = state.settings.sync;
  next.settings.updatedAt = now;
  state = next;
  save(); closeSheet(); render();
  toast("Restored");
}
function handleImportFile(e){
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { try { applyRestore(JSON.parse(r.result)); } catch (err) { toast("That file isn't a backup"); } };
  r.onerror = () => toast("Couldn't read that file");
  r.readAsText(file);
}
function doPasteRestore(){
  const raw = (val("#f-paste") || "").trim();
  if (!raw) return toast("Paste a backup first");
  try { applyRestore(JSON.parse(raw)); } catch (e) { toast("That isn't a backup"); }
}
function startFresh(){
  confirmSheet("Start fresh?", "The example figures go, and you begin with nothing recorded.", "Start fresh", () => {
    state = freshState(); save(); render(); toast("Ready");
    if (syncEnabled()) startSync();
  });
}
function resetAll(){
  confirmSheet("Erase everything?",
    "Every goal, bill and record goes" + (syncEnabled() ? ", on this device and every device you are synced with" : " from this device") + ". This cannot be undone.",
    "Erase everything", () => { state = freshState(); save(); closeSheet(); render(); toast("Erased"); });
}

/* ---- transactions ---- */
function addTx(t){
  state.tx.push(Object.assign({ id:uid(), date:todayISO(), note:"", label:"", auto:false, itemId:null, billPeriod:null }, t));
  save();
}
function deleteTx(id){
  state.tx = state.tx.filter(t => t.id !== id);
  state.tombstones[id] = Date.now();   // or a repeat would simply generate it again
  save(); render(); toast("Removed");
}
/** Tap a bill when it goes out: records the spend, tags the occurrence paid.
    Tap it again and the record comes back off. */
function toggleBill(itemId, period){
  const b = state.items.find(i => i.id === itemId);
  if (!b) return;
  const hit = state.tx.find(t => t.kind === "expense" && t.billPeriod === period && t.itemId === itemId);
  if (hit) {
    state.tx = state.tx.filter(t => t.id !== hit.id);
    state.tombstones[hit.id] = Date.now();
    save(); render(); toast(b.name + " — not paid after all");
    return;
  }
  addTx({ kind:"expense", amount:num(b.amount), label:b.name, itemId, billPeriod:period,
          date: period.length === 10 && period <= todayISO() ? period : todayISO() });
  render();
  toast("−" + fmt(b.amount) + " · " + b.name);
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener("click", e => {
  const hit = sel => e.target.closest(sel);

  const tab = hit("#tabs [data-tab]");
  if (tab) { ui.tab = tab.dataset.tab; ui.seeAll = false; render(); return; }
  const jump = hit("[data-tab-jump]");
  if (jump) { ui.tab = jump.dataset.tabJump; render(); return; }

  const key = hit("[data-key]");
  if (key) { padPress(key.dataset.key); return; }

  const chip = hit("[data-chip]");
  if (chip) { ui.label = chip.dataset.chip; refreshSheet(); return; }
  const when = hit("[data-when]");
  if (when) {
    if (when.dataset.when === "pick") ui.pick = true;
    else { ui.pick = false; ui.date = when.dataset.when; }
    refreshSheet(); return;
  }
  const src = hit("[data-src]");
  if (src) { ui.src = src.dataset.src; ui.borrow = ""; refreshSheet(); return; }
  const borrow = hit("[data-borrow]");
  if (borrow) { ui.borrow = borrow.dataset.borrow; ui.src = ""; refreshSheet(); return; }
  const sugg = hit("[data-sugg]");
  if (sugg) { ui.pad = String(num(sugg.dataset.sugg)); refreshSheet(); return; }

  const kind = hit("[data-kind]");
  if (kind) {
    sheetEl().querySelector("#f-kind").value = kind.dataset.kind;
    sheetEl().querySelectorAll("[data-kind]").forEach(b => b.setAttribute("aria-pressed", b === kind));
    return;
  }
  const shape = hit("[data-shape]");
  if (shape) {
    const s = shape.dataset.shape;
    sheetEl().querySelector("#f-shape").value = s;
    sheetEl().querySelectorAll("[data-shape]").forEach(b => b.setAttribute("aria-pressed", b === shape));
    sheetEl().querySelectorAll("[data-shape-month]").forEach(el => el.hidden = s !== "month");
    sheetEl().querySelectorAll("[data-shape-cycle]").forEach(el => el.hidden = s !== "cycle");
    return;
  }
  const day = hit("[data-day]");
  if (day) {
    const on = day.getAttribute("aria-pressed") !== "true";
    day.setAttribute("aria-pressed", on);
    const picked = [...sheetEl().querySelectorAll("[data-day][aria-pressed='true']")].map(b => b.dataset.day);
    sheetEl().querySelector("#f-days").value = picked.join(",");
    return;
  }
  const themeopt = hit("[data-themeopt]");
  if (themeopt) {
    sheetEl().querySelector("#f-themeval").value = themeopt.dataset.themeopt;
    sheetEl().querySelectorAll("[data-themeopt]").forEach(b => b.setAttribute("aria-pressed", b === themeopt));
    state.settings.theme = themeopt.dataset.themeopt;
    applyTheme();
    return;
  }

  const payBill = hit("[data-pay-bill]");
  if (payBill) { const [id, period] = payBill.dataset.payBill.split("|"); toggleBill(id, period); return; }

  const cut = hit("[data-cut]");
  if (cut) { const d = derive(); ui.goalIx = d.goals.findIndex(g => g.id === cut.dataset.cut); ui.pad = ""; sheetCut(); return; }
  const take = hit("[data-take]");
  if (take) { const d = derive(); ui.goalIx = d.goals.findIndex(g => g.id === take.dataset.take); ui.pad = ""; sheetTake(); return; }
  const openGoal = hit("[data-open-goal]");
  if (openGoal) { ui.tab = "goals"; render(); return; }

  const editItem = hit("[data-edit-item]");
  if (editItem) { sheetEditItem(editItem.dataset.editItem); return; }
  const newItem = hit("[data-new-item]");
  if (newItem) { sheetEditItem(null, newItem.dataset.newItem); return; }
  const delItem = hit("[data-del-item]");
  if (delItem) { deleteItem(delItem.dataset.delItem); return; }
  const delTx = hit("[data-del-tx]");
  if (delTx) { deleteTx(delTx.dataset.delTx); return; }

  const doer = hit("[data-do]");
  if (doer) {
    const map = {
      spend:doSpend, income:doIncome, cut:doCut, take:doTake, count:doCount,
      savesettings:doSaveSettings, copybackup:doCopyBackup, "paste-restore":doPasteRestore
    };
    if (doer.dataset.do === "saveitem") return doSaveItem(doer.dataset.id || null, doer.dataset.type);
    const fn = map[doer.dataset.do];
    if (fn) fn();
    return;
  }

  const act = hit("[data-act]");
  if (!act) return;
  const A = {
    spend: () => { ui.pad = ""; ui.label = ""; ui.other = ""; ui.date = todayISO(); ui.pick = false; sheetSpend(); },
    income: () => { ui.pad = ""; ui.borrow = ""; ui.src = ""; ui.date = todayISO(); ui.pick = false; sheetIncome(); },
    count: () => { ui.pad = ""; sheetCount(); },
    settings: sheetSettings,
    closesheet: () => closeSheet(),
    startfresh: startFresh,
    togglesync: doToggleSync,
    backup: exportData,
    restore: sheetRestore,
    erase: resetAll,
    seeall: () => { ui.seeAll = true; render(); }
  };
  if (A[act.dataset.act]) A[act.dataset.act]();
});

/* Keep the free-text label as it is typed, so a re-render doesn't lose it. */
/* The one free-text field either sheet has. Keeping the button in step as it
   is typed is the difference between "Say who it was from" and "Add €20 · Dad". */
document.addEventListener("input", e => {
  if (e.target.id === "f-when") {
    if (/^\d{4}-\d{2}-\d{2}$/.test(e.target.value) && e.target.value <= todayISO()) ui.date = e.target.value;
    return refreshSheet();
  }
  if (e.target.id !== "f-other") return;
  ui.other = e.target.value;
  refreshSheet();
});

if (themeQuery) {
  const onScheme = () => { if (!state || state.settings.theme === "auto") applyTheme(); };
  if (themeQuery.addEventListener) themeQuery.addEventListener("change", onScheme);
  else if (themeQuery.addListener) themeQuery.addListener(onScheme);
}

/* ---- quick capture from the home screen ----
   iOS will not give a web app a real widget, but a Shortcut can open a URL,
   and a Shortcut can live on the home screen or on Back Tap. So the app takes
   its actions from the hash: #spend=Coffee&amount=3.60&go */
function runHash(){
  const raw = location.hash.slice(1);
  if (!raw) return false;
  const q = {};
  raw.split("&").forEach(part => {
    const [k, v] = part.split("=");
    q[decodeURIComponent(k)] = v === undefined ? true : decodeURIComponent(v.replace(/\+/g, " "));
  });
  history.replaceState(null, "", location.pathname + location.search);   // never fire twice

  ui.date = todayISO(); ui.pick = false;
  const amount = q.amount ? parseAmount(q.amount) : 0;
  if (q.spend !== undefined) {
    const label = typeof q.spend === "string" ? q.spend : "";
    if (q.go && amount > 0 && label) {
      addTx({ kind:"expense", amount, label, date:todayISO() });
      ui.tab = "home"; render(); toast("−" + fmt(amount) + " · " + label);
      return true;
    }
    ui.pad = amount > 0 ? String(amount) : "";
    ui.label = label && state.settings.labels.indexOf(label) >= 0 ? label : (label ? OTHER : "");
    ui.other = ui.label === OTHER ? label : "";
    sheetSpend();
    return true;
  }
  if (q.add !== undefined) {
    ui.pad = amount > 0 ? String(amount) : "";
    sheetIncome();
    return true;
  }
  return false;
}

/* ============================================================
   Boot
   ============================================================ */
state = load();
if (runRepeats()) saveLocal();
render();
runHash();
/* A Shortcut fired while the app is already open changes the hash without
   reloading, so the same handler has to run again. */
window.addEventListener("hashchange", runHash);
startSync();

</script>
